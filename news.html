<title>時事英語 | TOEIC Daily</title>

<style>
body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}

/* ヘッダー */
.app-head{
  position:sticky;top:0;z-index:40;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.head-row{display:flex;align-items:center;gap:7px;padding:7px 0 0}
.head-row .grow{flex:1;min-width:0}
.head-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.head-title-en{font-family:var(--serif);font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.rail{display:flex;gap:3px;padding:8px 0 6px}
.rail button{
  flex:1;padding:0;border:0;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;
}
.rail .bar{width:100%;height:4px;border-radius:2px;background:var(--line)}
.rail .t{font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.rail button.done .bar{background:var(--accent)}
.rail button.cur .bar{background:var(--accent)}
.rail button.cur .t{color:var(--accent);font-weight:800}

/* 本文 */
.stage{padding-top:16px}
.para{font-family:var(--serif);font-size:17.5px;line-height:1.95;margin:0 0 14px}
.para:last-child{margin-bottom:0}
.sent.evid,.sent.play{background:var(--mark-soft);box-shadow:0 0 0 3px var(--mark-soft);border-radius:2px}
.tool-row{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}

/* 設問 */
.qbox+.qbox{margin-top:12px}
.qnum{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent);margin-bottom:5px}
.qprompt{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.6;margin:0 0 11px}
.choice{
  display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;
  padding:11px 12px;margin-top:7px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer;min-height:44px;white-space:normal;
}
.choice .k{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line-2);font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.choice .t{font-family:var(--serif);font-size:15.5px;line-height:1.55}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice.ng .k{background:var(--ng);border-color:var(--ng);color:#fff}
.choice[disabled]{cursor:default;opacity:1}
details.src{margin-bottom:12px}
details.src>summary{
  cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);
  padding:6px 0;list-style:none;
}
details.src>summary::-webkit-details-marker{display:none}
details.src>summary::before{content:"▸ ";}
details.src[open]>summary::before{content:"▾ ";}

/* 設問の見開き（広い画面のみ） */
.quiz-grid{display:grid;gap:14px}
@media (min-width:980px){
  body.split .wrap{max-width:1140px}
  .quiz-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .quiz-src{
    position:sticky;
    top:calc(var(--head-h,150px) + 14px);
    max-height:calc(100vh - var(--head-h,150px) - 104px);
    overflow:auto;
  }
  .quiz-src .para{font-size:17px;line-height:1.9}
}

/* 解説 */
.score-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 12px;margin-top:14px;
}
.score-bar .lb{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.score-bar .n{font-size:15px;font-weight:800;letter-spacing:-.01em}
.verdict{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng)}
.verdict.na{background:var(--surface-2);color:var(--muted)}
.evid-line{
  font-family:var(--serif);font-size:15.5px;line-height:1.8;
  background:var(--mark-soft);border-left:3px solid var(--mark);
  padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0;
  position:relative;padding-right:40px;
}
.tip{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.tip b{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}

/* 対訳 */
.pair{padding:12px 0;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.pair .e{font-family:var(--serif);font-size:16px;line-height:1.8}
.pair .j{font-size:14px;color:var(--ink-2);margin-top:5px}

/* 語彙 */
.vcard{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
.vcard:first-child{padding-top:0}
.vcard:last-child{border-bottom:0;padding-bottom:0}
.vcard .no{
  flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface-2);
  color:var(--muted);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.vcard .body{flex:1;min-width:0}
.vterm{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.25}
.vpos{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}
.vja{font-size:14.5px;margin-top:2px}
.vgloss{font-size:12.5px;color:var(--muted);margin-top:1px}
.vex{
  font-family:var(--serif);font-size:14px;line-height:1.7;color:var(--ink-2);
  border-left:2px solid var(--line-2);padding-left:10px;margin-top:8px;
  position:relative;padding-right:32px;
}
.vex .j{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:2px}
.star{
  flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--muted);font-size:16px;cursor:pointer;
}
.star.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark-ink)}
.say-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;padding:0;border-radius:7px;vertical-align:2px;
  border:1px solid var(--line-2);background:var(--surface);
  color:var(--accent);font-size:9px;line-height:1;cursor:pointer;
}
.vterm .say-btn{margin:0 6px 0 8px}
.quote .say-btn{margin-left:8px}
.evid-line .say-btn{position:absolute;right:8px;top:7px}

/* 文法・背景 */
.quote{
  font-family:var(--serif);font-size:16.5px;line-height:1.8;
  border-left:3px solid var(--accent);padding:2px 0 2px 13px;margin:0 0 6px;
}
.quote-ja{font-size:13px;color:var(--muted);padding-left:16px;margin-bottom:16px}
.blk{margin-top:16px}
.blk:first-of-type{margin-top:0}
.blk h3{font-size:14px;margin:0 0 6px;color:var(--accent-ink)}
.blk p{margin:0;font-size:14.5px;white-space:pre-wrap}
.blk p.en{font-family:var(--serif);font-size:15.5px;line-height:1.8}
.blk .w.has-gloss{border-bottom-color:transparent}

/* 対訳（音読を統合） */
.trans-bar{display:flex;gap:8px;flex-wrap:wrap}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px}
.sec-head .sec-label{margin:0}
.sec-tools{display:flex;gap:6px;flex:none}

/* 語彙：英単語だけを出す。カードをタップするとその語だけ開く */
.terms-only .vja,.terms-only .vgloss,.terms-only .vex{display:none}
.terms-only .vcard.open .vja,.terms-only .vcard.open .vgloss,.terms-only .vcard.open .vex{display:block}
.terms-only .vcard{cursor:pointer}
.sline{display:flex;gap:10px;align-items:flex-start;padding:8px 8px;border-radius:9px;cursor:pointer}
/* 区切り線は置かない。再生中の行が光るので、行の切れ目はそれで分かる */
/* 対訳では読みを妨げないよう語の下線を出さない（タップは従来どおり効く） */
.sline .w.has-gloss{border-bottom-color:transparent}
.sline .body{flex:1;min-width:0}
.sline .e{display:block;font-family:var(--serif);font-size:16.5px;line-height:1.6}
.sline .j{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.sline .pl{flex:none;color:var(--muted);font-size:11px;margin-top:5px}
.sline.play{background:var(--mark-soft)}
.sline.play .pl{color:var(--mark-ink)}
.hide-ja .sline .j{display:none}
.rate-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.rate-row input{flex:1}
.rate-row .v{font-size:13px;font-weight:700;width:42px;text-align:right;color:var(--muted)}

/* 完了 */

/* フッター */
.app-foot{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding:5px 0 calc(5px + env(safe-area-inset-bottom));
}
.foot-row{display:flex;align-items:center;gap:8px}
.foot-row .mid{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.foot-row .btn{min-width:80px;min-height:36px;padding:6px 12px;font-size:13.5px}
</style>

  "grammar": {
    "topic": "関係代名詞 which の非制限用法（前の節全体を受ける）",
    "quote": "The delays are forcing retailers to hold larger inventories, which raises warehouse costs.",
    "quoteJa": "この遅延により小売各社はより多くの在庫を抱えざるを得ず、それが倉庫費用を押し上げている。",
    "blocks": [
      {
        "heading": "構文",
        "body": "コンマ＋which の形です。ここでの which は直前の名詞 inventories ではなく、その前の節全体（「小売各社がより多くの在庫を抱えること」）を受けています。見分けの手がかりは動詞の形です。which が複数形の inventories を受けているなら raise になるはずですが、実際は raises と三人称単数になっています。つまり which が指しているのは「ひとつの事柄」＝前の節全体だと分かります。"
      },
      {
        "heading": "書き換え",
        "body": "非制限用法の which は and this に置き換えられることがほとんどです。\n・..., and this raises warehouse costs.\n・...; as a result, warehouse costs rise.\n逆に言えば、and this で置き換えて意味が通るなら「前の節全体を受ける which」だと判断できます。"
      },
      {
        "heading": "TOEIC での出題",
        "body": "Part 5 では、空所に which / that / what のどれを入れるかを問う形で出ます。重要なのは、コンマの直後に that は置けないという点です。非制限用法に that は使えないため、コンマがあれば that は真っ先に消せます。what も先行詞を取らないので不可です。\nPart 6 では、文と文のつながりを問う問題で、which 節の内容が前の文全体を受けているかどうかが解答の鍵になります。"
      },
      {
        "heading": "ビジネス文書での応用",
        "body": "・We will move the server on Sunday, which means the system will be unavailable that morning.（日曜にサーバーを移設します。そのため、当日の午前中はシステムをご利用いただけません）\n・The supplier raised its prices, which forced us to review the contract.（仕入先が値上げを行い、そのため契約の見直しを迫られました）\nメールで「そのため」「その結果」とつなぎたいときに使える型です。"

    },
    {
      "heading": "📌 在庫を持つコストという考え方",
      "body": "英語では carrying cost や holding cost と呼ばれます。在庫は貸借対照表の上では資産に見えますが、実務では「売れるまで現金にならないもの」です。近年は多くの企業が在庫を絞る方向で運営してきましたが、供給が不安定になると一転して積み増しに動きます。TOEIC の Part 7 でも、在庫や納期をめぐる社内メールは定番の題材です。"
    },
    {
      "heading": "📌 業界の動き — 港湾の分散",
      "body": "大きな港が詰まると、荷主は近隣の中小規模の港へ振り替えます。ただし小さな港は設備も人員も限られるため、振り替えられる量には上限があります。結果として、大型港の設備投資や労働環境の改善が中期的な争点になります。記事中で業界団体が設備の承認を急ぐよう求めているのは、この文脈です。"
    },
    {
      "heading": "📌 日本のビジネスパーソンへの示唆",
      "body": "日本は輸入の大半を海上輸送に頼っており、海外港湾の混雑は調達部門にとって直接の問題になります。仕入先との交渉では、価格だけでなくリードタイムと欠品時の対応をどう契約に書き込むかが問われます。英文メールでは delay、lead time、inventory、shipment といった語が繰り返し登場するため、この教材の語彙はそのまま実務で再会します。"
    }

<script src="core.js?v=3b70e94e"></script>
<script>
(function () {
  'use strict';
  var T = window.TOEIC, esc = T.esc;

  /* ホームに戻ったときにこのタブで開くよう覚えておく */
  T.Settings.set('hubTab', 'news');

  var STEPS = [
    { key: 'quiz',  label: '設問' },
    { key: 'ans',   label: '解説' },
    { key: 'trans', label: '対訳' },
    { key: 'vocab', label: '語彙' },
    { key: 'gram',  label: '文法' },
    { key: 'bg',    label: '背景' }
  ];

  var DATA = null, INDEX = [], PACKS = {};
  var step = 0, state = { answers: {}, graded: false, maxStep: 0, done: false };
  /* 今回の画面で選んだぶん。設問はこれだけを塗る */
  var fresh = {};
  var progKey = '';
  var playing = null;
  var bgEn = null;      // 背景解説の英訳（Gemini の結果）
  var bgBusy = false;

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  /* core.js が古いまま配信された場合でも落ちないようにする保険。
     アセットには内容ハッシュを付けているので通常は起きないが、
     壊れるより機能が消えるだけのほうがましなので握っておく。 */
  function hasAI() { try { return !!(T.AI && T.AI.enabled()); } catch (e) { return false; } }

  /* ================= 起動 ================= */

  function embeddedSample() {
    try { return JSON.parse($('sample-data').textContent); } catch (e) { return null; }
  }

  function boot() {
    PACKS = T.read('news.packs', {}) || {};
    var want = new URLSearchParams(location.search).get('id');

    fetchJSON('data/news/index.json').then(function (idx) {
      INDEX = (idx && idx.items) || [];
    }).catch(function () {
      INDEX = [];
    }).then(function () {
      Object.keys(PACKS).forEach(function (id) {
        if (!INDEX.some(function (it) { return it.id === id; })) {
          var p = PACKS[id];
          INDEX.push({ id: id, date: p.date || id, time: p.time || '', genre: p.genre || '', title: (p.title && p.title.ja) || id, local: true });
        }
      });
      INDEX.sort(function (a, b) { return (b.id || '').localeCompare(a.id || ''); });
      var id = want || (INDEX[0] && INDEX[0].id) || null;
      return load(id);
    }).catch(function (e) { fail(e); });
  }

  function fetchJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + url);
      return r.json();
    });
  }

  function load(id) {
    if (id && PACKS[id]) return start(PACKS[id]);
    var item = INDEX.filter(function (it) { return it.id === id; })[0];
    if (!item) {
      var s = embeddedSample();
      if (!s) throw new Error('教材が見つかりません');
      return start(s);
    }
    return fetchJSON('data/news/' + (item.file || (item.id + '.json'))).then(start).catch(function () {
      var s = embeddedSample();
      if (s) { start(s); T.toast('データを読めないため内蔵サンプルを表示しています'); }
      else throw new Error('教材を読み込めませんでした');
    });
  }

  function start(d) {
    DATA = d;
    bgEn = null; bgBusy = false;
    progKey = 'news:' + (d.id || d.date || 'unknown');
    var p = T.Log.progress(progKey);
    /* 前回の答えは残しておく。解説で「前回どれを選んだか」を見るため。
       ただし設問では出さない（fresh を参照）。 */
    state = {
      answers: (p && p.answers) || {},
      graded: !!(p && p.graded),
      maxStep: (p && p.maxStep) || 0,
      done: !!(p && p.done)
    };
    fresh = {};
    step = Math.min((p && p.step) || 0, STEPS.length - 1);
    renderHead();
    render();
  }

  function fail(e) {
    stage.innerHTML = '<div class="card"><div class="sec-label">読み込めません</div><p>' +
      esc(e && e.message || e) + '</p><p class="small muted">⚙ から JSON を貼り付けて取り込むこともできます。</p></div>';
  }

  function save() {
    T.Log.saveProgress(progKey, {
      answers: state.answers, graded: state.graded,
      maxStep: state.maxStep, done: state.done, step: step,
      title: DATA.title && DATA.title.ja, date: DATA.date
    });
  }

  /* ================= ヘッダー ================= */

  function renderHead() {
    var m = [];
    if (DATA.date) m.push('<span>' + esc(DATA.date.replace(/-/g, '/')) + (DATA.time ? ' ' + esc(DATA.time) : '') + '</span>');
    if (DATA.genre) m.push('<span class="chip">' + esc(DATA.genre) + '</span>');
    if (DATA.sample) m.push('<span class="chip chip-mark">サンプル</span>');
    $('meta').innerHTML = m.join('');
    $('titleEn').textContent = (DATA.title && (DATA.title.en || DATA.title.ja)) || '';
    renderRail();
  }

  function renderRail() {
    $('rail').innerHTML = STEPS.map(function (s, i) {
      var cls = [];
      if (i === step) cls.push('cur');
      else if (i <= state.maxStep) cls.push('done');
      return '<button data-i="' + i + '" class="' + cls.join(' ') + '">' +
        '<span class="bar"></span><span class="t">' + esc(s.label) + '</span></button>';
    }).join('');
  }

  $('rail').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]'); if (!b) return;
    go(+b.dataset.i);
  });

  /* ================= 画面遷移 ================= */

  function go(i) {
    T.TTS.cancel(); playing = null;
    step = Math.max(0, Math.min(i, STEPS.length - 1));
    state.maxStep = Math.max(state.maxStep, step);
    save(); renderRail(); render();
    window.scrollTo(0, 0);
  }

  $('btnPrev').addEventListener('click', function () {
    if (stage.dataset.view === 'done') { stage.dataset.view = ''; render(); return; }
    if (step > 0) { go(step - 1); return; }
    /* 設問の画面では戻る先が無いので、ホームへ出る */
    stopPlay();
    location.href = 'index.html';
  });

  $('btnNext').addEventListener('click', function () {
    if (stage.dataset.view === 'done') { stage.dataset.view = ''; go(0); return; }
    if (STEPS[step].key === 'quiz' && !state.graded && allAnswered()) { grade(); return; }
    if (step === STEPS.length - 1) { finish(); return; }
    go(step + 1);
  });

  function renderFoot() {
    var isDone = stage.dataset.view === 'done';
    $('btnPrev').disabled = false;
    $('btnPrev').textContent = (!isDone && step === 0) ? '← Home' : '← Back';
    var next = $('btnNext');
    next.disabled = false;
    if (isDone) {
      $('footMid').textContent = '完了';
      next.textContent = 'Restart';
      return;
    }
    $('footMid').textContent = (step + 1) + ' / ' + STEPS.length + '　' + STEPS[step].label;
    if (STEPS[step].key === 'quiz' && !state.graded && allAnswered()) {
      next.textContent = 'Check';
    } else if (step === STEPS.length - 1) {
      next.textContent = 'Finish';
    } else {
      next.textContent = 'Next →';
    }
  }

  /* ================= 描画 ================= */

  /* 見出しは sticky で高さが変わるため、実測して CSS 変数に渡す。
     これが左カラムを貼り付ける位置の基準になる。 */
  function syncHeadHeight() {
    var el = document.querySelector('.app-head');
    if (el) document.documentElement.style.setProperty('--head-h', el.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncHeadHeight);

  function render() {
    stage.dataset.view = '';
    var fn = {
      quiz: viewQuiz, ans: viewAns, trans: viewTrans,
      vocab: viewVocab, gram: viewGram, bg: viewBg
    }[STEPS[step].key];
    stage.innerHTML = fn();
    document.body.classList.toggle('split', STEPS[step].key === 'quiz' && stage.dataset.view !== 'done');
    syncHeadHeight();
    renderFoot();
  }

  function sentencesOf(pi) {
    return (DATA.summary && DATA.summary.paragraphs[pi] && DATA.summary.paragraphs[pi].sentences) || [];
  }

  function flatSummary() {
    var out = [];
    ((DATA.summary && DATA.summary.paragraphs) || []).forEach(function (p) {
      (p.sentences || []).forEach(function (s) { out.push(s); });
    });
    return out;
  }

  function summaryHTML() {
    var ps = (DATA.summary && DATA.summary.paragraphs) || [];
    var n = -1;   /* 段落をまたぐ通し番号。flatSummary の並びと合わせる */
    return ps.map(function (p) {
      return '<p class="para">' + p.sentences.map(function (s) {
        n++;
        return '<span class="sent" data-src="sum" data-i="' + n + '">' +
          T.markupEnglish(s.en, DATA.glossary) + '</span> ';
      }).join('') + '</p>';
    }).join('');
  }

  function sampleNote() {
    return DATA.sample && DATA.sampleNote
      ? '<div class="card" style="background:var(--mark-soft);border-color:var(--mark)"><p class="small" style="margin:0">' +
        esc(DATA.sampleNote) + '</p></div>'
      : '';
  }

  /* ---- 設問 ---- */

  function viewQuiz() {
    var src = '<details class="src" open><summary>本文を表示</summary>' +
      '<div class="card">' + summaryHTML() +
        '<div class="tool-row">' +
          '<button class="btn btn-sm icon" data-play-all="sum" title="本文を通して再生">▶</button>' +
          '<button class="btn btn-sm icon" id="stopAll" title="停止">■</button>' +
          '<span class="hint" style="margin:0">語をタップすると語注が出ます。</span>' +
        '</div></div></details>';
    var body = (DATA.questions || []).map(function (q, i) {
      return '<div class="card qbox">' +
        '<div class="qnum">Q' + (i + 1) + '</div>' +
        '<p class="qprompt">' + esc(q.prompt) + '</p>' +
        q.choices.map(function (c) {
          var sel = fresh[q.id] === c.key;
          return '<button class="choice' + (sel ? ' sel' : '') + '" data-q="' + esc(q.id) + '" data-k="' + esc(c.key) + '"' +
            (state.graded ? ' disabled' : '') + '>' +
            '<span class="k">' + esc(c.key) + '</span><span class="t">' + esc(c.text) + '</span></button>';
        }).join('') +
      '</div>';
    }).join('');
    if (state.graded) body += '<p class="hint">採点済みです。解説は次の画面にあります。</p>';
    return sampleNote() +
      '<div class="quiz-grid">' +
        '<div class="quiz-src">' + src + '</div>' +
        '<div class="quiz-qs">' + body + '</div>' +
      '</div>';
  }

  function allAnswered() {
    return (DATA.questions || []).every(function (q) { return !!state.answers[q.id]; });
  }

  function grade() {
    state.graded = true;
    save(); renderRail(); go(step + 1);
  }

  function correctCount() {
    return (DATA.questions || []).filter(function (q) { return state.answers[q.id] === q.answer; }).length;
  }

  /* ---- 解説 ---- */

  function viewAns() {
    var qs = DATA.questions || [], n = correctCount();
    var unanswered = qs.filter(function (q) { return !state.answers[q.id]; }).length;
    var head = '<div class="score-bar"><span class="lb">結果</span>' +
      '<span class="n">' + n + ' / ' + qs.length + '</span>' +
      (unanswered === qs.length
        ? '<span class="verdict na">未解答</span>'
        : '<span class="verdict ' + (n === qs.length ? 'ok' : 'ng') + '">' +
          (n === qs.length ? '全問正解' : (qs.length - n) + '問 要復習') + '</span>') +
      '</div>';
    return head + qs.map(function (q, i) {
      var mine = state.answers[q.id], ok = mine === q.answer;
      var mark = !mine ? '<span class="verdict na">未解答</span>'
                       : '<span class="verdict ' + (ok ? 'ok' : 'ng') + '">' + (ok ? '正解' : '不正解') + '</span>';
      var ev = q.evidence ? (sentencesOf(q.evidence.p)[q.evidence.s] || null) : null;
      return '<div class="card">' +
        '<div class="qnum">Q' + (i + 1) + ' ' + mark + '</div>' +
        '<p class="qprompt">' + esc(q.prompt) + '</p>' +
        q.choices.map(function (c) {
          var cls = '';
          if (c.key === q.answer) cls = ' ok';
          else if (c.key === mine) cls = ' ng';
          return '<button class="choice' + cls + '" disabled>' +
            '<span class="k">' + esc(c.key) + '</span>' +
            '<span class="t">' + esc(c.text) +
            (c.ja ? '<span class="cja">' + esc(c.ja) + '</span>' : '') +
            '</span></button>';
        }).join('') +
        (ev ? '<div class="evid-line">' + T.markupEnglish(ev.en, DATA.glossary) +
              '<button class="say-btn" data-say="' + esc(ev.en) + '" title="再生">▶</button>' +
              '<div class="small muted" style="font-family:var(--sans);margin-top:5px">' + esc(ev.ja) + '</div></div>' : '') +
        '<p style="font-size:14.5px;margin:10px 0 0">' + esc(q.explanation) + '</p>' +
        (q.tip ? '<div class="tip"><b>PART 7 の解き方</b>' + esc(q.tip) + '</div>' : '') +
      '</div>';
    }).join('');
  }

  /* ---- 対訳（音読を統合） ---- */

  function linesFor() {
    return flatSummary();
  }

  function lineRows(src) {
    return linesFor(src).map(function (s, i) {
      return '<div class="sline" data-src="' + src + '" data-i="' + i + '">' +
        '<span class="body"><span class="e">' + T.markupEnglish(s.en, DATA.glossary) + '</span>' +
        '<span class="j">' + esc(s.ja || '') + '</span></span>' +
        '<span class="pl">▶</span></div>';
    }).join('');
  }

  function viewTrans() {
    var showJa = T.Settings.get('showJa');
    var rate = T.Settings.get('rate');
    return '<div class="card' + (showJa ? '' : ' hide-ja') + '" id="transCard">' +
      '<div class="sec-head"><span class="sec-label">対訳</span>' +
        '<span class="sec-tools">' +
          '<button class="btn btn-sm icon" data-play-all="sum" title="通して再生">▶</button>' +
          '<button class="btn btn-sm icon" id="stopAll" title="停止">■</button>' +
          '<button class="btn btn-sm icon' + (showJa ? ' on' : '') + '" id="toggleJa" title="' +
            (showJa ? '和訳を隠す' : '和訳を出す') + '">訳</button>' +
          '<button class="btn btn-sm icon" id="copyAll" title="英文をすべてコピー">📋</button>' +
        '</span></div>' +
      lineRows('sum') +
      '<hr class="sep">' +
      '<div class="rate-row"><span class="small muted" style="flex:none">速度</span>' +
        '<input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="' + rate + '">' +
        '<span class="v" id="rateV">' + Number(rate).toFixed(2) + '</span></div>' +
      '</div>' +
      '<p class="hint">行をタップするとその1文を再生し、再生中の行が光ります。英単語のタップは語注です。シャドーイングは速度 0.8 前後から。</p>';
  }

  /* ---- 語彙 ---- */

  function viewVocab() {
    var showMean = T.Settings.get('vocabJa') !== false;
    return '<div class="card' + (showMean ? '' : ' terms-only') + '" id="vocabCard">' +
      '<div class="sec-head"><span class="sec-label">Vocabulary</span>' +
        '<span class="sec-tools">' +
          '<button class="btn btn-sm icon' + (showMean ? ' on' : '') + '" id="toggleVocabJa" title="' +
            (showMean ? '英単語だけにする' : '意味を出す') + '">訳</button>' +
        '</span></div>' +
      (DATA.vocabulary || []).map(function (v) {
        var on = T.Vocab.has(v.term);
        return '<div class="vcard">' +
          '<span class="no">' + esc(v.no || '') + '</span>' +
          '<div class="body">' +
            '<div class="vterm">' + esc(v.term) +
              '<button class="say-btn" data-say="' + esc(v.term) + '" title="単語を再生">▶</button>' +
              '<span class="vpos">（' + esc(v.pos) + '）</span></div>' +
            '<div class="vja">' + esc(v.ja) + '</div>' +
            (v.gloss ? '<div class="vgloss">' + esc(v.gloss) + '</div>' : '') +
            (v.example ? '<div class="vex">' + esc(v.example.en) +
              '<button class="say-btn" data-say="' + esc(v.example.en) + '" title="例文を再生">▶</button>' +
              (v.example.ja ? '<div class="j">' + esc(v.example.ja) + '</div>' : '') + '</div>' : '') +
          '</div>' +
          '<button class="star' + (on ? ' on' : '') + '" data-term="' + esc(v.term) + '" title="語彙帳">' +
            (on ? '★' : '☆') + '</button>' +
        '</div>';
      }).join('') +
      '</div><p class="hint">' +
      (showMean
        ? '★ を押すと<a href="vocab.html" style="color:var(--accent)">語彙帳</a>に入り、間隔をあけて復習できます。現在 ' + T.Vocab.count() + ' 語。'
        : '英単語だけを出しています。意味を思い出してから、カードをタップして答え合わせ。') + '</p>';
  }

  /* ---- 文法・背景 ---- */

  function viewGram() {
    var g = DATA.grammar || {};
    return '<div class="card">' +
      '<div class="sec-label">Grammar Focus</div>' +
      (g.topic ? '<p style="margin:0 0 12px;font-weight:700">' + esc(g.topic) + '</p>' : '') +
      (g.quote ? '<p class="quote">' + T.markupEnglish(g.quote, DATA.glossary) +
        '<button class="say-btn" data-say="' + esc(g.quote) + '" title="再生">▶</button></p>' : '') +
      (g.quoteJa ? '<p class="quote-ja">' + esc(g.quoteJa) + '</p>' : '') +
      (g.blocks || []).map(function (b) {
        return '<div class="blk"><h3>' + esc(b.heading) + '</h3><p>' + esc(b.body) + '</p></div>';
      }).join('') +
    '</div>';
  }

  function viewBg() {
    var src = (DATA.sources || []).filter(function (s) { return s.url; });
    var blocks = DATA.background || [];
    var can = hasAI();
    var en = can && T.Settings.get('bgEn') === true;
    return '<div class="card">' +
      '<div class="sec-head"><span class="sec-label">Background</span>' +
        (can
          ? '<span class="sec-tools"><button class="btn btn-sm icon' + (en ? ' on' : '') +
            '" id="toggleBgEn" title="' + (en ? '日本語で読む' : '英語で読む') + '">EN</button></span>'
          : '') +
      '</div>' +
      (en && bgBusy ? '<p class="hint" style="margin-top:0">英訳しています…</p>' : '') +
      blocks.map(function (b, i) {
        var useEn = en && bgEn && bgEn[i];
        if (!useEn) return '<div class="blk"><h3>' + esc(b.heading) + '</h3><p>' + esc(b.body) + '</p></div>';
        /* 文ごとに包む。語注の照会に渡すのは段落ではなくこの1文 */
        var sents = String(bgEn[i]).match(/[^.!?]+[.!?]*s*/g) || [String(bgEn[i])];
        return '<div class="blk"><h3>' + esc(b.heading) + '</h3><p class="en">' +
          sents.map(function (s) {
            return '<span class="sent">' + T.markupEnglish(s, DATA.glossary) + '</span>';
          }).join('') + '</p></div>';
      }).join('') +
      (can ? (en && bgEn ? '<p class="hint">英単語をタップすると意味が出ます。</p>' : '') : '<p class="hint">⚙ で Gemini のキーを設定すると、英語で読めます。</p>') +
    '</div>' +
    (src.length ? '<div class="card"><div class="sec-label">出典</div>' + src.map(function (s) {
      return '<p class="small" style="margin:0 0 6px"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
        esc(s.title || s.url) + '</a>' + (s.publisher ? ' <span class="muted">— ' + esc(s.publisher) + '</span>' : '') + '</p>';
    }).join('') + '</div>' : '');
  }

  /* 終わったらホームに戻る。結果の画面は出さない（数字はホームに出ている）。
     「Done」はホーム側で数秒だけ出す。 */
  function finish() {
    T.TTS.cancel(); playing = null;
    state.done = true; state.maxStep = STEPS.length - 1; save();
    T.Log.touchToday();
    if (T.flash) T.flash('Done');
    location.href = 'index.html';
  }

  /* ================= 再生 ================= */

  function markPlay(src, i) {
    /* 対訳の行（.sline）と、設問の本文中の文（.sent）の両方に印を付ける */
    var rows = stage.querySelectorAll('.sline, .sent[data-src]');
    for (var k = 0; k < rows.length; k++) {
      rows[k].classList.toggle('play', !!src && rows[k].dataset.src === src && +rows[k].dataset.i === i);
    }
    if (src && i >= 0) {
      var cur = stage.querySelector('[data-src="' + src + '"][data-i="' + i + '"]');
      if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  var sentAudio = null;

  /* 先に作ってリポジトリに置いた文ごとの音声。
     並びは flatSummary と同じなので、data-i がそのまま添字になる。 */
  function sentURL(i) {
    var a = DATA && DATA.audio;
    return a && a.lines && a.lines[i] ? 'data/news/' + a.lines[i] : '';
  }

  function stopSentAudio() {
    if (!sentAudio) return;
    try { sentAudio.pause(); } catch (e) {}
    sentAudio.onended = sentAudio.onerror = null;
    sentAudio = null;
  }

  /* 用意された音声があればそれを、無ければ端末の読み上げを使う。
     音声待ちの教材でも読めなくならないようにするため。 */
  /* 次の1文を先に読み込んでおく。鳴り終わってから読み始めると、
     その待ち時間ぶん文と文の間が空いてしまう。 */
  var nextClip = null;

  function preload(i) {
    var url = sentURL(i);
    if (!url) { nextClip = null; return; }
    var a = new Audio();
    a.preload = 'auto';
    a.src = url;
    nextClip = { url: url, el: a };
  }

  function saySent(i, onend) {
    var ss = linesFor();
    if (!ss[i]) { if (onend) onend(); return; }

    var url = sentURL(i);
    if (!url) {
      T.TTS.speak(ss[i].en, { rate: T.Settings.get('rate'), onend: onend });
      return;
    }

    stopSentAudio();
    var a = (nextClip && nextClip.url === url) ? nextClip.el : new Audio(url);
    nextClip = null;
    preload(i + 1);
    sentAudio = a;
    a.playbackRate = T.Settings.get('rate') || 1;
    var fell = false;
    var fallback = function () {
      if (fell) return;
      fell = true;
      stopSentAudio();
      T.TTS.speak(ss[i].en, { rate: T.Settings.get('rate'), onend: onend });
    };
    a.onended = function () { stopSentAudio(); if (onend) onend(); };
    a.onerror = fallback;
    a.play().catch(fallback);
  }

  function playOne(src, i) {
    var ss = linesFor(src);
    if (!ss[i]) return;
    playing = 'one'; markPlay(src, i);
    saySent(i, function () { if (playing === 'one') { playing = null; markPlay(null, -1); } });
  }

  /* 文と文の間。音声からは前後の無音を削ってあるので、
     続けて鳴らすと切れ目が無くなる。息継ぎのぶんだけここで空ける。 */
  var SENT_GAP = 450;

  function playAll(src) {
    var ss = linesFor(src);
    playing = 'all';
    (function next(i) {
      if (playing !== 'all' || i >= ss.length) { playing = null; markPlay(null, -1); return; }
      markPlay(src, i);
      saySent(i, function () {
        if (playing !== 'all') return;
        setTimeout(function () { if (playing === 'all') next(i + 1); }, SENT_GAP);
      });
    })(0);
  }

  function stopPlay() { T.TTS.cancel(); stopSentAudio(); nextClip = null; playing = null; markPlay(null, -1); }

  /* 自動コピーが拒否される端末向けの受け皿。選択済みで出すので、
     長押しやキー操作でそのままコピーできる。 */
  function showCopyFallback(text) {
    modal('<h2>英文をコピー</h2>' +
      '<p class="small muted" style="margin:-6px 0 8px">自動でコピーできませんでした。' +
      '下の枠はすでに選択してあります。長押し（PC は Ctrl+C）でコピーしてください。</p>' +
      '<textarea id="copyBox" readonly></textarea>' +
      '<div class="tool-row"><button class="btn btn-sm" id="copyClose">閉じる</button></div>',
      function (bg) {
        var ta = bg.querySelector('#copyBox');
        ta.value = text;
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        bg.querySelector('#copyClose').onclick = function () { bg.remove(); };
      });
  }

  /* 英文だけを1つの連続したテキストにして返す。
     読み上げアプリに貼ったとき、改行で区切られて途切れないようにするため。 */
  function fullText() {
    return linesFor('sum').map(function (s) { return s.en; }).join(' ');
  }
  function copyText(text) {
    /* 選択して execCommand で写す昔ながらの方法。https でない場合や、
       クリップボードAPIが拒否された場合の受け皿。 */
    function legacy() {
      return new Promise(function (res, rej) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, text.length);
          var ok = document.execCommand('copy');
          ta.remove();
          ok ? res() : rej(new Error('copy failed'));
        } catch (e) { rej(e); }
      });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(legacy);
    }
    return legacy();
  }

  /* ================= 操作 ================= */

  stage.addEventListener('click', function (e) {
    var t = e.target;

    var ch = t.closest('.choice[data-q]');
    if (ch && !ch.disabled) {
      state.answers[ch.dataset.q] = ch.dataset.k;
      fresh[ch.dataset.q] = ch.dataset.k;
      save(); render(); return;
    }

    var say = t.closest('[data-say]');
    if (say) { stopPlay(); T.TTS.speak(say.dataset.say, { rate: T.Settings.get('rate') }); return; }

    var st = t.closest('.star[data-term]');
    if (st) {
      var term = st.dataset.term;
      var v = (DATA.vocabulary || []).filter(function (x) { return x.term === term; })[0] || { term: term };
      if (T.Vocab.has(term)) { T.Vocab.remove(term); T.toast('語彙帳から外しました'); }
      else {
        T.Vocab.add({
          term: v.term, pos: v.pos, ja: v.ja, gloss: v.gloss, example: v.example,
          src: DATA.id, srcTitle: (DATA.title && DATA.title.ja) || ''
        });
        T.toast('語彙帳に追加しました');
      }
      render(); return;
    }

    var pa = t.closest('[data-play-all]');
    if (pa) { stopPlay(); playAll(pa.dataset.playAll); return; }

    if (t.closest('#copyAll')) {
      var full = fullText();
      copyText(full)
        .then(function () { T.toast('英文をコピーしました'); })
        .catch(function () { showCopyFallback(full); });
      return;
    }

    if (t.id === 'toggleBgEn') {
      var on = T.Settings.get('bgEn') !== true;
      T.Settings.set('bgEn', on);
      /* 訳がまだ無ければ Gemini に頼む。一度訳したらこの端末に残るので、
         同じ教材で切り替え直しても通信しない。 */
      if (on && !bgEn && !bgBusy) {
        var texts = (DATA.background || []).map(function (b) { return b.body; });
        if (texts.length) {
          bgBusy = true;
          render();
          T.AI.toEnglish(texts, DATA.id).then(function (arr) {
            bgEn = arr; bgBusy = false;
            if (STEPS[step].key === 'bg') render();
          }).catch(function (err) {
            bgBusy = false;
            T.Settings.set('bgEn', false);
            T.toast((err && err.message) || '英訳できませんでした');
            if (STEPS[step].key === 'bg') render();
          });
          return;
        }
      }
      render();
      return;
    }

    if (t.id === 'toggleVocabJa') {
      T.Settings.set('vocabJa', T.Settings.get('vocabJa') === false);
      render();
      return;
    }

    if (t.id === 'stopAll') { stopPlay(); return; }

    if (t.id === 'toggleJa') {
      var show = !T.Settings.get('showJa');
      T.Settings.set('showJa', show);
      var card = $('transCard');
      if (card) card.classList.toggle('hide-ja', !show);
      t.classList.toggle('on', show);
      t.title = show ? '和訳を隠す' : '和訳を出す';
      return;
    }

    /* 英単語だけの表示のとき、カードをタップするとその語だけ開く */
    var vc = t.closest('.vcard');
    if (vc && vc.closest('.terms-only')) { vc.classList.toggle('open'); return; }

    /* 語注が先。行の再生よりも単語タップを優先する */
    var w = t.closest('.w');
    if (w) { openPop(w); return; }

    var sl = t.closest('.sline[data-src]');
    if (sl) { stopPlay(); playOne(sl.dataset.src, +sl.dataset.i); return; }

    closePop();
  });

  stage.addEventListener('input', function (e) {
    if (e.target.id === 'rate') {
      var v = parseFloat(e.target.value);
      T.Settings.set('rate', v);
      $('rateV').textContent = v.toFixed(2);
    }
  });

  /* ---- 語注ポップ ---- */

  var pop = null, popWord = null;

  function closePop() {
    if (pop) { pop.remove(); pop = null; }
    if (popWord) { popWord.classList.remove('open'); popWord = null; }
  }

  /* タップした語が入っている英文だけを取り出す（和訳や補足は除く） */
  function contextOf(el) {
    var host = el.closest('.sent, .sline, .evid-line, .quote, .vex, .para');
    if (!host) return '';
    var c = host.cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll('.j, .small, .muted, .hint'), function (n) { n.remove(); });
    return (c.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 400);
  }

  function openPop(el) {
    closePop();
    var k = el.dataset.w, raw = el.dataset.raw;
    var g = DATA.glossary && DATA.glossary[k];
    popWord = el; el.classList.add('open');
    pop = document.createElement('div');
    pop.className = 'pop';
    var addTerm = (g && g.lemma) || raw;
    var inBook = T.Vocab.has(addTerm);
    var aiData = null;

    var head = '<div class="term">' + esc(raw) +
      (g && g.lemma && g.lemma.toLowerCase() !== k ? '<span class="lemma">← ' + esc(g.lemma) + '</span>' : '') +
      '</div>';
    /* 語注（Gemini が使えないときの本体、使えるときは失敗時の受け皿） */
    var glossHTML = g
      ? '<div class="ja">' + (g.pos ? '<span class="muted small">(' + esc(g.pos) + ') </span>' : '') + esc(g.ja) + '</div>' +
        (g.note ? '<div class="note">' + esc(g.note) + '</div>' : '')
      : '<div class="note">この語の語注はありません。</div>';
    var row = '<div class="row">' +
      '<button class="btn btn-sm icon' + (inBook ? ' on' : '') + '" data-add="' + esc(addTerm) + '" title="' +
        (inBook ? '語彙帳から外す' : '語彙帳に追加') + '">' + (inBook ? '★' : '☆') + '</button>' +
      '<button class="btn btn-sm icon" data-sayw="' + esc(raw) + '" title="発音を聞く">🔊</button></div>';
    var ctx = contextOf(el);
    /* Gemini が使えるときは語注を出さない。同じ意味が二度並ぶだけなので */
    var mid = hasAI()
      ? '<div class="pop-ai-b muted small">照会中…</div>'
      : glossHTML + '<div class="pop-hint">⚙ で Gemini のキーを設定すると、この文での使われ方も出ます。</div>';

    pop.dataset.word = raw;
    pop.innerHTML = head + mid + row;
    document.body.appendChild(pop);

    if (hasAI() && ctx) {
      var mine = raw;
      T.AI.lookup(raw, ctx, DATA.id).then(function (r) {
        if (!pop || pop.dataset.word !== mine) return;
        var b = pop.querySelector('.pop-ai-b');
        if (!b) return;
        aiData = r;
        b.className = 'pop-ai-b';
        b.innerHTML =
          (r.ja ? '<div class="pop-ai-ja">' + (r.pos ? '<span class="muted small">(' + esc(r.pos) + ') </span>' : '') +
            esc(r.ja) + '</div>' : '') +
          (r.tip ? '<div class="pop-ai-u">' + esc(r.tip) + '</div>' : '');
      }).catch(function (e) {
        if (!pop || pop.dataset.word !== mine) return;
        var b = pop.querySelector('.pop-ai-b');
        /* 失敗したら手元の語注に戻す。何も出ないよりはよい */
        if (b) b.outerHTML = glossHTML +
          '<div class="pop-hint">' + esc((e && e.message) || '取得できませんでした') + '</div>';
      });
    }

    var r = el.getBoundingClientRect();
    var top = r.bottom + window.scrollY + 6;
    var left = r.left + window.scrollX;
    left = Math.min(left, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 12);
    left = Math.max(window.scrollX + 12, left);
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';

    pop.addEventListener('click', function (e) {
      var a = e.target.closest('[data-add]');
      if (a) {
        var term = a.dataset.add;
        if (!T.Vocab.has(term)) {
          var m = g || aiData || {};
          T.Vocab.add({ term: term, pos: m.pos || '', ja: m.ja || '',
                        gloss: (g && g.note) || (aiData && aiData.tip) || '',
                        src: DATA.id, srcTitle: (DATA.title && DATA.title.ja) || '' });
          T.toast('語彙帳に追加しました');
        } else { T.Vocab.remove(term); T.toast('語彙帳から外しました'); }
        closePop(); return;
      }
      var s = e.target.closest('[data-sayw]');
      if (s) { stopPlay(); T.TTS.speak(s.dataset.sayw, { rate: 0.85 }); }
    });
  }

  document.addEventListener('click', function (e) {
    if (pop && !pop.contains(e.target) && !e.target.closest('.w')) closePop();
  }, true);

  /* ================= モーダル ================= */

  var modal = T.modal;

  $('btnFinish').addEventListener('click', function () { if (stage.dataset.view !== 'done') finish(); });

  $('btnPick').addEventListener('click', function () {
    var rows = INDEX.length ? INDEX.map(function (it) {
      var cur = DATA && it.id === DATA.id;
      return '<p style="margin:0 0 4px"><a href="?id=' + encodeURIComponent(it.id) + '" style="color:inherit;text-decoration:none">' +
        '<span class="chip chip-plain">' + esc((it.date || it.id) + (it.time ? ' ' + it.time : '')) + '</span> ' +
        (it.genre ? '<span class="chip">' + esc(it.genre) + '</span> ' : '') +
        (cur ? '<b>' : '') + esc(it.title || it.id) + (cur ? '</b>' : '') +
        (it.local ? ' <span class="muted small">（取り込み）</span>' : '') + '</a></p>';
    }).join('') : '<p class="muted small">目次が読めませんでした。ローカルのファイルを直接開いた場合は読めません（内蔵サンプルで動作します）。</p>';
    modal('<h2>教材を選ぶ</h2>' + rows +
      '<div class="tool-row"><button class="btn btn-sm" id="mClose">閉じる</button></div>',
      function (bg) { bg.querySelector('#mClose').onclick = function () { bg.remove(); }; });
  });

  /* 音声と Gemini の設定は core.js で共通。ここでは教材まわりだけ足す */
  $('btnCfg').addEventListener('click', function () {
    T.openSettings({
      extraHTML:
        '<h2>教材を取り込む</h2>' +
        '<p class="small muted" style="margin:-6px 0 8px">ルーティンが出力した JSON を貼り付けるか、ファイルを選びます。' +
        '取り込んだ教材はこの端末に保存されます。</p>' +
        '<textarea id="impText" placeholder="ここに JSON を貼り付け"></textarea>' +
        '<div class="tool-row"><button class="btn btn-sm btn-primary" id="impGo">取り込む</button>' +
          '<input type="file" id="impFile" accept=".json,application/json" class="small"></div>',
      extraButtons: '<button class="btn btn-sm" id="cfgReset">この教材の記録を消す</button>',
      onMount: function (bg) {
        bg.querySelector('#impGo').onclick = function () { doImport(bg.querySelector('#impText').value, bg); };
        bg.querySelector('#impFile').onchange = function (e) {
          var f = e.target.files && e.target.files[0];
          if (!f) return;
          var fr = new FileReader();
          fr.onload = function () { doImport(String(fr.result), bg); };
          fr.readAsText(f);
        };
        bg.querySelector('#cfgReset').onclick = function () {
          var all = T.read('progress', {});
          delete all[progKey];
          T.write('progress', all);
          state = { answers: {}, graded: false, maxStep: 0, done: false };
          step = 0;
          bg.remove();
          renderRail();
          render();
          T.toast('この教材の記録を消しました');
        };
      }
    });
  });

  function doImport(text, bg) {
    var d;
    try { d = JSON.parse(text); }
    catch (e) { T.toast('JSON として読めません'); return; }
    var bad = validate(d);
    if (bad) { T.toast(bad); return; }
    PACKS[d.id] = d;
    if (!T.write('news.packs', PACKS)) { T.toast('保存できませんでした（容量）'); return; }
    bg.remove();
    location.search = '?id=' + encodeURIComponent(d.id);
  }

  function validate(d) {
    if (!d || d.type !== 'news') return 'type が news ではありません';
    if (!d.id) return 'id がありません';
    if (!d.summary || !Array.isArray(d.summary.paragraphs) || !d.summary.paragraphs.length) return 'summary がありません';
    if (!Array.isArray(d.questions) || !d.questions.length) return 'questions がありません';
    for (var i = 0; i < d.questions.length; i++) {
      var q = d.questions[i];
      if (!Array.isArray(q.choices) || !q.choices.length) return 'Q' + (i + 1) + ' の選択肢がありません';
      if (!q.choices.some(function (c) { return c.key === q.answer; })) return 'Q' + (i + 1) + ' の answer が選択肢と一致しません';
    }
    return null;
  }

  boot();
})();
</script>
</body>
</html>
