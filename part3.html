<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Part 3 | TOEIC Daily</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="style.css?v=6fa34579">
<style>
body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}

.app-head{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:6px;padding:7px 0 0}
.head-row .grow{flex:1;min-width:0}
.head-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.head-scene{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.35}
.rail{display:flex;gap:3px;padding:8px 0 6px}
.rail button{
  flex:1;padding:0;border:0;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;
}
.rail .bar{width:100%;height:4px;border-radius:2px;background:var(--line)}
.rail button.done .bar,.rail button.cur .bar{background:var(--accent)}
.rail .t{font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.rail button.cur .t{color:var(--accent);font-weight:800}

.stage{padding-top:14px}

/* 進行状況 */
.status{padding:12px 14px}
.count{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 0 10px}
.count i{display:block;height:100%;background:var(--mark);transition:width .25s linear}
.status .st{display:flex;align-items:center;gap:10px;font-size:13.5px}
.status .st b{flex:1;min-width:0}
.status .st .num{flex:none;font-size:13px;font-weight:800;color:var(--mark-ink)}
.status .hint{margin-top:6px}
.mics{display:flex;gap:5px;flex:none}
.mic{
  min-width:26px;height:22px;padding:0 6px;border-radius:6px;
  border:1px solid var(--line-2);background:var(--surface-2);
  font-size:10.5px;font-weight:800;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
}
.mic.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark-ink)}

/* 設問 */
.qbox{margin-top:12px}
.qbox.cur{border-color:var(--mark);box-shadow:0 0 0 2px var(--mark-soft)}
.qnum{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent);margin-bottom:5px}
.qprompt{font-family:var(--serif);font-size:15.5px;font-weight:700;line-height:1.6;margin:0 0 10px}
.choice{
  display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;white-space:normal;
  padding:10px 12px;margin-top:7px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer;min-height:42px;
}
.choice .k{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line-2);font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.choice .t{font-family:var(--serif);font-size:15px;line-height:1.5}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice.ng .k{background:var(--ng);border-color:var(--ng);color:#fff}

/* 結果 */
.score-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 12px;margin-top:14px;
}
.score-bar .lb{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.score-bar .n{font-size:15px;font-weight:800;letter-spacing:-.01em}
.verdict{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng)}
.verdict.na{background:var(--surface-2);color:var(--muted)}

/* スクリプト */
.line{display:flex;gap:9px;align-items:flex-start;padding:7px 6px;border-radius:8px}
.line .pl{
  flex:none;align-self:flex-start;margin-top:2px;
  width:26px;height:26px;padding:0;border-radius:8px;
  border:1px solid var(--line-2);background:var(--surface);
  color:var(--accent);font-size:10px;line-height:1;cursor:pointer;
}
.line .tag{
  flex:none;width:26px;height:20px;border-radius:5px;background:var(--surface-2);
  border:1px solid var(--line);font-size:10px;font-weight:800;color:var(--muted);
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.line .body{flex:1;min-width:0}
.line .e{display:block;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.line .j{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.line.play{background:var(--mark-soft)}
.line.evid{box-shadow:inset 3px 0 0 var(--mark)}
.hide-ja .line .j{display:none}

/* 語彙 */
.vcard{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
.vcard:first-child{padding-top:0}
.vcard:last-child{border-bottom:0;padding-bottom:0}
.vcard .no{
  flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface-2);
  color:var(--muted);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.vcard .body{flex:1;min-width:0}
.vterm{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.25}
.vpos{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}
.vja{font-size:14.5px;margin-top:2px}
.vgloss{font-size:12.5px;color:var(--muted);margin-top:1px}
.say-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;padding:0;border-radius:7px;vertical-align:2px;
  border:1px solid var(--line-2);background:var(--surface);
  color:var(--accent);font-size:9px;line-height:1;cursor:pointer;
}
.vterm .say-btn{margin:0 6px 0 8px}
.terms-only .vja,.terms-only .vgloss{display:none}
.terms-only .vcard.open .vja,.terms-only .vcard.open .vgloss{display:block}
.terms-only .vcard{cursor:pointer}
.star{
  flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;
}
.star.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark-ink)}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.sec-head .sec-label{margin:0}
.sec-tools{display:flex;gap:6px;flex:none}
.expl{font-size:14px;margin:8px 0 0;line-height:1.75}
.tip{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.75}
.tip b{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.flow{font-size:14.5px;font-weight:700;line-height:1.7;margin:0}
/* Point は枠で区切らず、見出しと本文を続けて読ませる */
.point h3:first-of-type{margin-top:18px}
.point h3{
  margin:26px 0 8px;font-size:15px;color:var(--accent-ink);line-height:1.5;
  padding-top:16px;border-top:1px solid var(--line);
}
.point p{margin:0;font-size:14px;line-height:1.8}

.app-foot{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding:5px 0 calc(5px + env(safe-area-inset-bottom));
}
/* 残り時間はフッターの上端に薄く出す。画面の上を設問に明け渡すため */
.app-foot .bar{
  position:absolute;left:0;top:0;height:3px;width:0;
  background:var(--mark);transition:width .25s linear;
}
.foot-row{display:flex;align-items:center;gap:8px}
.foot-row .mid{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.foot-row .btn{min-width:80px;min-height:36px;padding:6px 12px;font-size:13.5px}
</style>
</head>
<body>

<header class="app-head">
  <div class="wrap">
    <div class="head-row">
      <div class="grow">
        <div class="head-meta" id="meta"></div>
        <div class="head-scene" id="scene">読み込み中…</div>
      </div>
      <a class="icon-btn" href="index.html?tab=drill" title="ホーム">⌂</a>
      <button class="icon-btn" id="btnFinish" title="終えてホームへ">✓</button>
      <button class="icon-btn" id="btnPick" title="セットを選ぶ">▤</button>
      <button class="icon-btn" id="btnCfg" title="設定">⚙</button>
    </div>
    <div class="rail" id="rail"></div>
  </div>
</header>

<main class="wrap stage" id="stage"></main>

<nav class="app-foot">
  <i class="bar" id="fbar"></i>
  <div class="wrap foot-row">
    <button class="btn" id="btnPrev">← Back</button>
    <div class="mid" id="footMid"></div>
    <button class="btn btn-primary" id="btnNext">Next →</button>
  </div>
</nav>

<script src="core.js?v=7ff422c2"></script>
<script>
(function () {
  'use strict';
  var T = window.TOEIC, esc = T.esc;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  /* 1回に1セット（会話1本＋設問3問）。本番の1セットと同じ単位。 */
  /* ホームに戻ったときにこのタブで開くよう覚えておく */
  T.Settings.set('hubTab', 'drill');

  var STEPS = [
    { key: 'quiz',   label: '設問' },
    { key: 'ans',    label: '解説' },
    { key: 'script', label: '対訳' },
    { key: 'vocab',  label: '語彙' },
    { key: 'point',  label: 'Point' }
  ];

  var SET = null, INDEX = [];
  var step = 0, maxStep = 0;

  /* 設問ステップの中の段階。本番と同じ順序で進む */
  var phase = 'prep';            // prep / play / read / answer
  var qi = -1, reading = false;
  var ans = {}, scored = false;
  var done = false;   /* 一度でも最後まで解いたか。解き直しても消さない */
  /* 今回の画面で選んだぶん。設問はこれだけを塗る。
     前回の選択が入ったままだと、開き直しても解き直しにならないため。 */
  var fresh = {};

  var audioRest = 0;   /* 会話音声の残り秒。フッターに出す */
  var curTag = '';     /* 読み上げ中の話者。フッターに出す */
  var left = 0, timer = null;
  var lineIdx = -1, plan = {};
  var progKey = '';

  var audioEl = null;   /* 用意された会話音声。鳴らしている間だけ入る */
  var PREP_DEFAULT = 13;   // 設問の先読み
  var ANS_DEFAULT = 8;     // 本番は設問の読み上げごとに約8秒の間がある
  var TYPE_LABEL = { gist: '概要', detail: '詳細', intent: '意図', next: '次の行動', infer: '推測', graphic: '図表' };

  /* ================= 起動 ================= */

  function fetchJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + url);
      return r.json();
    });
  }

  function boot() {
    var want = new URLSearchParams(location.search).get('id');
    fetchJSON('data/part3/index.json')
      .then(function (idx) { INDEX = (idx && idx.items) || []; })
      .catch(function () { INDEX = []; })
      .then(function () {
        INDEX.sort(function (a, b) { return (b.id || '').localeCompare(a.id || ''); });
        var it = INDEX.filter(function (x) { return x.id === want; })[0] || INDEX[0];
        if (!it) throw new Error('セットが見つかりません');
        return fetchJSON('data/part3/' + (it.file || (it.id + '.json')));
      })
      .then(start)
      .catch(fail);
  }

  function fail(e) {
    $('scene').textContent = '読み込めません';
    $('rail').innerHTML = '';
    stage.innerHTML = '<div class="card"><div class="sec-label">読み込めません</div><p>' +
      esc(e && e.message || e) + '</p>' +
      '<p class="small muted">Part 3 の教材はまだ作られていないかもしれません。' +
      'ルーティンが <code>data/part3/</code> に書き出すと、ここに出ます。</p></div>';
    $('btnNext').disabled = true;
    $('btnPrev').disabled = true;
  }

  function start(d) {
    SET = d;
    progKey = 'part3:' + (d.id || 'unknown');
    var p = T.Log.progress(progKey);

    /* 前回の答えは残しておく。解説で「前回どれを選んだか」を見るため。
       ただし設問では出さない（下の fresh を参照）。 */
    done = !!(p && (p.done || p.maxStep >= STEPS.length - 1));
    ans = (p && p.answers) || {};
    scored = !!(p && p.scored);
    maxStep = (p && p.maxStep) || 0;
    fresh = {};
    step = 0;
    renderHead();
    enterPrep();
  }

  function qs() { return (SET && SET.questions) || []; }
  function lines() { return (SET && SET.lines) || []; }
  function save() {
    T.Log.saveProgress(progKey, {
      answers: ans, scored: scored, maxStep: maxStep, done: done,
      date: SET.date, scene: SET.scene
    });
  }

  /* ================= ヘッダー ================= */

  function renderHead() {
    var m = [];
    if (SET.date) m.push('<span>' + esc(SET.date.replace(/-/g, '/')) + (SET.time ? ' ' + esc(SET.time) : '') + '</span>');
    m.push('<span class="chip">Part 3</span>');
    m.push('<span class="chip chip-plain">' + ((SET.speakers || []).length) + '人</span>');
    if (SET.sample) m.push('<span class="chip chip-mark">サンプル</span>');
    $('meta').innerHTML = m.join('');
    /* 場面は解き終わるまで出さない。何の話かを先に知ると先読みの意味が薄れる */
    $('scene').textContent = (step > 0 || scored) ? (SET.scene || '') : '会話1本・設問3問';
    renderRail();
  }

  function renderRail() {
    $('rail').innerHTML = STEPS.map(function (s, i) {
      var cls = i === step ? 'cur' : (i <= maxStep ? 'done' : '');
      return '<button data-i="' + i + '" class="' + cls + '">' +
        '<span class="bar"></span><span class="t">' + esc(s.label) + '</span></button>';
    }).join('');
  }

  $('rail').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]');
    if (b) go(+b.dataset.i);
  });

  function go(i) {
    stopAll();
    step = Math.max(0, Math.min(i, STEPS.length - 1));
    maxStep = Math.max(maxStep, step);
    if (step > 0 && !scored) { scored = true; T.Log.touchToday(); }
    save();
    renderHead();
    if (step === 0) enterPrep(); else render('top');
  }

  /* ================= 設問ステップの進行 =================
     本番と同じ流れ。設問と選択肢は最初から最後まで見えたまま。
       先読み → 会話（1回だけ）→ 設問の読み上げ＋解答時間 → 見直し
     本番も問題冊子は手元にあり、会話のあとにナレーターが設問を読み上げる。 */

  function prepSec() {
    var v = T.Settings.get('p3prep');
    return (typeof v === 'number' && v > 0) ? v : PREP_DEFAULT;
  }
  function ansSec() {
    var v = T.Settings.get('p3ans');
    return (typeof v === 'number' && v >= 0) ? v : ANS_DEFAULT;
  }
  function clearTimer() { clearInterval(timer); timer = null; }
  function stopAll() { clearTimer(); phase = 'answer'; T.TTS.cancel(); stopAudio(); stopLineAudio(); markLine(-1); }

  /* 残り秒。画面は作り直さず、数字とバーだけ書き換える */
  function countdown(sec, onDone) {
    left = sec; paintCount(sec);
    clearTimer();
    timer = setInterval(function () {
      left--; paintCount(sec);
      if (left <= 0) { clearTimer(); onDone(); }
    }, 1000);
  }
  function setBar(pct) {
    var b = $('fbar');
    if (b) b.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }

  function paintCount(total) {
    setBar((left / total) * 100);
    renderFoot();
  }

  function enterPrep() {
    phase = 'prep'; qi = -1; reading = false;
    audioRest = 0; curTag = '';
    render('top');
    countdown(prepSec(), playConv);
  }

  /* あらかじめ作ってリポジトリに置いた会話音声。無ければ端末の読み上げに落ちる */
  function audioURL() {
    var a = SET && SET.audio;
    return a && a.file ? 'data/part3/' + a.file : '';
  }

  function stopAudio() {
    if (!audioEl) return;
    try { audioEl.pause(); } catch (e) {}
    audioEl.onended = audioEl.onerror = audioEl.ontimeupdate = null;
    audioEl = null;
  }

  function paintAudio() {
    if (!audioEl) return;
    var total = audioEl.duration || (SET.audio && SET.audio.sec) || 0;
    audioRest = Math.max(0, Math.ceil(total - audioEl.currentTime));
    if (total) setBar(100 - (audioEl.currentTime / total) * 100);
    renderFoot();
  }

  /* 音声ファイルで流す。落ちていたら端末の読み上げに戻す（学習を止めないため） */
  function playFile() {
    T.TTS.cancel();
    stopAudio();
    var a = new Audio(audioURL());
    audioEl = a;
    a.playbackRate = T.Settings.get('rate') || 1;
    a.onended = function () { stopAudio(); if (phase === 'play') readQuestions(); };
    a.onerror = function () { stopAudio(); if (phase === 'play') playByTTS(); };
    a.ontimeupdate = paintAudio;
    a.play().catch(function () {
      /* 端末が自動再生を止めた場合。押してもらう */
      var h = stage.querySelector('.status .hint');
      if (h) h.innerHTML = '<button class="btn btn-sm btn-primary" id="aGo">▶ 会話を再生</button>';
      var b = $('aGo');
      if (b) b.onclick = function () { if (audioEl) audioEl.play(); b.remove(); };
    });
  }

  function playConv() {
    clearTimer();
    phase = 'play'; lineIdx = -1; audioRest = 0; curTag = '';
    setBar(0);
    render('top');
    if (audioURL()) { playFile(); return; }
    playByTTS();
  }

  function playByTTS() {
    /* 声が揃う前に始めると、読み上げの失敗が連鎖して全部の行が一瞬で
       流れてしまう。一覧が届いてから始め、届かない端末でも詰まらせない。 */
    var started = false;
    function begin() {
      if (started || phase !== 'play') return;
      started = true;
      if (!T.TTS.english().length) { noVoice(); return; }
      plan = T.TTS.speakerPlan(SET.speakers);
      var ls = lines();
      (function next(i) {
        if (phase !== 'play') return;
        if (i >= ls.length) { readQuestions(); return; }
        lineIdx = i; markMic();
        var sp = plan[ls[i].tag] || {};
        T.TTS.speak(ls[i].en, {
          rate: T.Settings.get('rate'),
          voiceURI: sp.voiceURI, pitch: sp.pitch,
          onend: function () { next(i + 1); }
        });
      })(0);
    }
    T.TTS.onReady(begin);
    setTimeout(begin, 2500);
  }

  function noVoice() {
    if (stage.querySelector('.novoice')) return;
    var d = document.createElement('div');
    d.className = 'card novoice';
    d.innerHTML = '<p class="hint" style="margin:0">この端末で英語の音声が見つかりません。' +
      '⚙ の「読み上げの音声」を確認してください。Skip で先に進めます。</p>';
    stage.insertBefore(d, stage.firstChild);
  }

  /* 会話のあと、設問を1問ずつ読み上げてから解答時間を取る */
  function readQuestions() {
    T.TTS.cancel();
    stopAudio();
    phase = 'read'; qi = -1;
    var list = qs();
    (function stepQ(i) {
      if (phase !== 'read') return;
      if (i >= list.length) { clearTimer(); phase = 'answer'; render(); return; }
      qi = i; reading = true;
      render();
      /* 本番と同じく「Question 〜」と番号を読んでから設問に入る */
      T.TTS.speak('Question ' + (i + 1) + '. ' + list[i].prompt, {
        rate: T.Settings.get('rate'),
        onend: function () {
          if (phase !== 'read') return;
          var wait = ansSec();
          if (!wait) { stepQ(i + 1); return; }   /* 0 なら間を置かず次へ */
          reading = false; render();
          countdown(wait, function () { stepQ(i + 1); });
        }
      });
    })(0);
  }

  /* 端末の読み上げで流すときは、いま誰が話しているかをフッターに出す。
     用意された音声のときは追えないので、代わりに残り秒が出る。 */
  function markMic() {
    curTag = (lines()[lineIdx] || {}).tag || '';
    renderFoot();
  }

  /* ================= 各ステップの画面 ================= */

  /* 画面の上にはもう状態を出さない。残り時間と今の段階はフッターに寄せた。
     設問を見ながら聞くのが本番の形なので、上は設問だけにしたい。 */
  function statusHTML() { return ''; }

  function viewQuiz() {
    return statusHTML() + qs().map(function (q, i) {
      var on = (phase === 'read' && i === qi);
      return '<div class="card qbox' + (on ? ' cur' : '') + '" data-qi="' + i + '">' +
        '<div class="qnum">Q' + (i + 1) +
          (q.type && TYPE_LABEL[q.type] ? '　' + TYPE_LABEL[q.type] : '') + '</div>' +
        '<p class="qprompt">' + esc(q.prompt) + '</p>' +
        q.choices.map(function (c) {
          var sel = fresh[q.id] === c.key;
          return '<button class="choice' + (sel ? ' sel' : '') + '" data-q="' + esc(q.id) + '" data-k="' + esc(c.key) + '">' +
            '<span class="k">' + esc(c.key) + '</span><span class="t">' + esc(c.text) + '</span></button>';
        }).join('') +
        '</div>';
    }).join('');
  }

  function viewAns() {
    var list = qs();
    var n = list.filter(function (q) { return ans[q.id] === q.answer; }).length;
    var html = '<div class="score-bar"><span class="lb">結果</span>' +
      '<span class="n">' + n + ' / ' + list.length + '</span>' +
      '<span class="verdict ' + (n === list.length ? 'ok' : 'ng') + '">' +
      (n === list.length ? '全問正解' : (list.length - n) + '問 要復習') + '</span></div>';

    list.forEach(function (q, i) {
      var mine = ans[q.id], ok = mine === q.answer;
      var ev = (q.evidence || []).map(function (li) { return lines()[li]; }).filter(Boolean);
      html += '<div class="card">' +
        '<div class="qnum">Q' + (i + 1) +
          (q.type && TYPE_LABEL[q.type] ? '　' + TYPE_LABEL[q.type] : '') + '　' +
          (!mine ? '<span class="verdict na">未解答</span>'
                 : '<span class="verdict ' + (ok ? 'ok' : 'ng') + '">' + (ok ? '正解' : '不正解') + '</span>') +
        '</div>' +
        '<p class="qprompt">' + esc(q.prompt) + '</p>' +
        q.choices.map(function (c) {
          var cls = c.key === q.answer ? ' ok' : (c.key === mine ? ' ng' : '');
          return '<button class="choice' + cls + '" disabled>' +
            '<span class="k">' + esc(c.key) + '</span>' +
            '<span class="t">' + esc(c.text) +
            (c.ja ? '<span class="cja">' + esc(c.ja) + '</span>' : '') +
            '</span></button>';
        }).join('') +
        ev.map(function (l) {
          return '<div class="line evid" style="margin-top:10px;cursor:default">' +
            '<span class="tag">' + esc(l.tag) + '</span>' +
            '<span class="body"><span class="e">' + esc(l.en) + '</span>' +
            '<span class="j">' + esc(l.ja || '') + '</span></span></div>';
        }).join('') +
        '<p class="expl">' + esc(q.explanation || '') + '</p>' +
        (q.tip ? '<div class="tip" style="margin-top:10px"><b>ここでの聞き方</b>' + esc(q.tip) + '</div>' : '') +
        '</div>';
    });
    return html;
  }

  function viewScript() {
    var showJa = T.Settings.get('showJa');
    /* 根拠の印は付けない。解説ステップで設問ごとに該当行を引用しているので、
       対訳では素の会話として読めるほうがよい。 */
    return '<div class="card' + (showJa ? '' : ' hide-ja') + '" id="scriptCard">' +
      '<div class="sec-head"><span class="sec-label">対訳</span>' +
        '<span class="sec-tools">' +
          '<button class="btn btn-sm icon" id="replay" title="通して再生">▶</button>' +
          '<button class="btn btn-sm icon" id="stopBtn" title="停止">■</button>' +
          '<button class="btn btn-sm icon' + (showJa ? ' on' : '') + '" id="toggleJa" title="' +
            (showJa ? '和訳を隠す' : '和訳を出す') + '">訳</button>' +
        '</span></div>' +
      lines().map(function (l, li) {
        return '<div class="line" data-i="' + li + '">' +
          '<span class="tag">' + esc(l.tag) + '</span>' +
          '<span class="body"><span class="e">' + T.markupEnglish(l.en, SET.glossary) + '</span>' +
          '<span class="j">' + esc(l.ja || '') + '</span></span>' +
          '<button class="pl" data-play="' + li + '" title="この行を再生">▶</button></div>';
      }).join('') +
      '</div>';
  }

  function viewVocab() {
    var g = SET.glossary || {};
    var keys = Object.keys(g);
    if (!keys.length) return '<div class="card"><p class="small muted" style="margin:0">この会話には語注がありません。</p></div>';
    var showMean = T.Settings.get('vocabJa') !== false;
    return '<div class="card' + (showMean ? '' : ' terms-only') + '" id="vocabCard">' +
      '<div class="sec-head"><span class="sec-label">Vocabulary</span>' +
        '<span class="sec-tools"><button class="btn btn-sm icon' + (showMean ? ' on' : '') +
          '" id="toggleVocabJa" title="' + (showMean ? '英単語だけにする' : '意味を出す') + '">訳</button></span></div>' +
      keys.map(function (k, i) {
        var e = g[k], term = e.lemma || k;
        var on = T.Vocab.has(term);
        return '<div class="vcard">' +
          '<span class="no">' + (i + 1) + '</span>' +
          '<div class="body">' +
            '<div class="vterm">' + esc(term) +
              '<button class="say-btn" data-sayw="' + esc(term) + '" title="単語を再生">▶</button>' +
              (e.pos ? '<span class="vpos">（' + esc(e.pos) + '）</span>' : '') + '</div>' +
            '<div class="vja">' + esc(e.ja || '') + '</div>' +
            (e.note ? '<div class="vgloss">' + esc(e.note) + '</div>' : '') +
          '</div>' +
          '<button class="star' + (on ? ' on' : '') + '" data-term="' + esc(term) + '" title="語彙帳">' +
            (on ? '★' : '☆') + '</button></div>';
      }).join('') +
      '</div><p class="hint">' +
      (showMean
        ? '★ で<a href="vocab.html" style="color:var(--accent)">語彙帳</a>に入り、間隔をあけて復習できます。現在 ' + T.Vocab.count() + ' 語。'
        : '英単語だけを出しています。意味を思い出してから、カードをタップして答え合わせ。') + '</p>';
  }

  function viewPoint() {
    var p = SET.point;
    if (!p || !(p.items || []).length) {
      return '<div class="card"><p class="small muted" style="margin:0">' +
        'このセットには総括がありません。設問ごとの聞き方は解説にあります。</p></div>';
    }
    /* 全体を1枚の枠に入れ、中は見出しと本文を続けて並べる。
       項目ごとに枠を切ると読み物として途切れるため。 */
    return '<div class="card point">' +
      '<div class="sec-label">会話の型</div>' +
      '<p class="flow">' + esc(p.flow || '') + '</p>' +
      '<p class="small muted" style="margin:6px 0 0">この型を覚えておくと、次に同じ展開が来たときに' +
      '設問の順番まで予測できます。</p>' +
      p.items.map(function (it) {
        return '<h3>' + esc(it.title) + '</h3><p>' + esc(it.body) + '</p>';
      }).join('') +
      '</div>';
  }

  /* scroll: 'top' / 'q' / 省略 */
  function render(scroll) {
    var k = STEPS[step].key;
    stage.innerHTML =
      k === 'quiz' ? viewQuiz() :
      k === 'ans' ? viewAns() :
      k === 'script' ? viewScript() :
      k === 'vocab' ? viewVocab() : viewPoint();
    if (k === 'quiz' && phase === 'play') markMic();
    renderFoot();
    /* 先読みの残りが他の画面に持ち越されないようにする */
    if (!lineAudio && !audioEl) setBar(0);
    /* 設問の読み上げ中は動かさない。本番は紙の問題用紙なので、
       勝手に画面が動くと目で追っている場所を見失う。
       いまどの設問かは枠の色で分かる。 */
    if (scroll === 'top') window.scrollTo(0, 0);
  }

  function midLabel() {
    if (step !== 0) return (step + 1) + ' / ' + STEPS.length + '　' + STEPS[step].label;
    if (phase === 'prep') return '先読み　' + left + ' 秒';
    if (phase === 'play') return '会話 再生中' + (audioRest ? '　' + audioRest + ' 秒' : (curTag ? '　' + curTag : ''));
    if (phase === 'read') {
      return '設問 ' + (qi + 1) + ' / ' + qs().length + (reading ? '　読み上げ' : '　解答 ' + left + ' 秒');
    }
    return '1 / ' + STEPS.length + '　設問';
  }

  function renderFoot() {
    var prev = $('btnPrev'), next = $('btnNext'), mid = $('footMid');
    prev.disabled = false;
    prev.textContent = step === 0 ? '← Home' : '← Back';
    next.disabled = false;
    mid.textContent = midLabel();

    if (step === 0) {
      if (phase === 'prep') next.textContent = 'Play ▶';
      else if (phase === 'play' || phase === 'read') next.textContent = 'Skip';
      else next.textContent = 'Check';
      return;
    }
    next.textContent = step === STEPS.length - 1 ? 'Finish' : 'Next →';
  }

  /* ================= 操作 ================= */

  $('btnNext').addEventListener('click', function () {
    if (step === 0) {
      if (phase === 'prep') { clearTimer(); playConv(); return; }
      if (phase === 'play') { T.TTS.cancel(); stopAudio(); readQuestions(); return; }
      if (phase === 'read') { clearTimer(); T.TTS.cancel(); phase = 'answer'; render('top'); return; }
      go(1);
      return;
    }
    if (step === STEPS.length - 1) { finish(); return; }
    go(step + 1);
  });

  $('btnPrev').addEventListener('click', function () {
    if (step > 0) { go(step - 1); return; }
    /* 設問の画面では戻る先が無いので、ホーム（実践タブ）へ出る */
    stopAll();
    location.href = 'index.html?tab=drill';
  });

  $('btnFinish').addEventListener('click', finish);

  function finish() {
    stopAll();
    if (!scored) { scored = true; T.Log.touchToday(); }
    maxStep = STEPS.length - 1;
    done = true;
    save();
    if (T.flash) T.flash('Done');
    location.href = 'index.html?tab=drill';
  }

  stage.addEventListener('click', function (e) {
    var t = e.target;

    var ch = t.closest('.choice[data-q]');
    if (ch && !ch.disabled) {
      ans[ch.dataset.q] = ch.dataset.k;
      fresh[ch.dataset.q] = ch.dataset.k;
      save();
      /* 押した位置を動かさないよう、その設問の中だけ塗り替える */
      var box = ch.closest('.qbox');
      Array.prototype.forEach.call(box.querySelectorAll('.choice'), function (b) {
        b.classList.toggle('sel', b === ch);
      });
      return;
    }

    var sw = t.closest('[data-sayw]');
    if (sw) { stopPlay(); T.TTS.speak(sw.dataset.sayw, { rate: 0.85 }); return; }

    var st = t.closest('.star[data-term]');
    if (st) {
      var term = st.dataset.term;
      var g = SET.glossary || {};
      var hit = null;
      Object.keys(g).forEach(function (k) { if ((g[k].lemma || k) === term) hit = g[k]; });
      if (T.Vocab.has(term)) { T.Vocab.remove(term); T.toast('語彙帳から外しました'); }
      else {
        T.Vocab.add({ term: term, pos: (hit && hit.pos) || '', ja: (hit && hit.ja) || '',
                      gloss: (hit && hit.note) || '', src: SET.id,
                      srcTitle: 'Part 3 ' + (SET.scene || '') });
        T.toast('語彙帳に追加しました');
      }
      render();
      return;
    }

    if (t.closest('#toggleVocabJa')) {
      T.Settings.set('vocabJa', T.Settings.get('vocabJa') === false);
      render();
      return;
    }

    var gw = t.closest('.vcard');
    if (gw && gw.closest('.terms-only')) { gw.classList.toggle('open'); return; }

    if (t.closest('#replay')) { replayAll(); return; }
    if (t.closest('#stopBtn')) { stopPlay(); return; }

    if (t.closest('#toggleJa')) {
      var show = !T.Settings.get('showJa');
      T.Settings.set('showJa', show);
      var card = $('scriptCard');
      if (card) card.classList.toggle('hide-ja', !show);
      var b2 = $('toggleJa');
      if (b2) { b2.classList.toggle('on', show); b2.title = show ? '和訳を隠す' : '和訳を出す'; }
      return;
    }

    var w = t.closest('.w');
    if (w) {
      /* なぞって選んでいる最中に語注が開かないようにする */
      var sel = window.getSelection && window.getSelection();
      if (sel && !sel.isCollapsed) return;
      openPop(w); return;
    }

    var pl = t.closest('.pl[data-play]');
    if (pl) { stopPlay(); playLine(+pl.dataset.play); return; }

    closePop();
  });

  /* ---- 対訳の再生 ---- */

  var chain = false;

  function markLine(i) {
    var ls = stage.querySelectorAll('.line[data-i]');
    for (var k = 0; k < ls.length; k++) ls[k].classList.toggle('play', +ls[k].dataset.i === i);
    if (i >= 0) {
      var c = stage.querySelector('.line[data-i="' + i + '"]');
      if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
  var lineAudio = null;

  /* 先に作っておいた1行ぶんの音声。会話本体と同じ声なので、
     対訳に移った瞬間に声が変わることがなくなる。 */
  function lineURL(i) {
    var a = SET && SET.audio;
    return a && a.lines && a.lines[i] ? 'data/part3/' + a.lines[i] : '';
  }

  function stopLineAudio() {
    if (!lineAudio) return;
    try { lineAudio.pause(); } catch (e) {}
    lineAudio.onended = lineAudio.onerror = lineAudio.ontimeupdate = null;
    lineAudio = null;
  }

  function stopPlay() {
    chain = false; T.TTS.cancel(); stopLineAudio(); nextClip = null;
    setBar(0); markLine(-1);
  }

  function speakByTTS(i, onend) {
    var p = T.TTS.speakerPlan(SET.speakers);
    var l = lines()[i];
    var sp = p[l.tag] || {};
    T.TTS.speak(l.en, { rate: T.Settings.get('rate'), voiceURI: sp.voiceURI, pitch: sp.pitch, onend: onend });
  }

  /* 次の1本を先に読み込んでおく。鳴り終わってから読み始めると、
     その待ち時間ぶん文と文の間が空いてしまう。 */
  var nextClip = null;

  function preload(i) {
    var url = lineURL(i);
    if (!url) { nextClip = null; return; }
    var a = new Audio();
    a.preload = 'auto';
    a.src = url;
    nextClip = { url: url, el: a };
  }

  function speakLine(i, onend) {
    markLine(i);
    var url = lineURL(i);
    if (!url) { speakByTTS(i, onend); return; }

    stopLineAudio();
    var a = (nextClip && nextClip.url === url) ? nextClip.el : new Audio(url);
    nextClip = null;
    preload(i + 1);
    lineAudio = a;
    a.playbackRate = T.Settings.get('rate') || 1;

    /* フッターのバーを再生の進み具合にする。
       続けて鳴らしているときは会話全体、1行だけならその行の中での位置。 */
    a.ontimeupdate = function () {
      var d = a.duration || 0;
      if (!d) return;
      var frac = a.currentTime / d;
      var total = lines().length || 1;
      setBar(chain ? ((i + frac) / total) * 100 : frac * 100);
    };
    var fell = false;
    /* 音声が無い・鳴らせないときは端末の読み上げに戻す。学習を止めないため */
    var fallback = function () {
      if (fell) return;
      fell = true;
      stopLineAudio();
      speakByTTS(i, onend);
    };
    a.onended = function () { stopLineAudio(); if (onend) onend(); };
    a.onerror = fallback;
    a.play().catch(fallback);
  }
  function playLine(i) {
    if (!lines()[i]) return;
    chain = false;
    speakLine(i, function () { setBar(0); markLine(-1); });
  }
  /* 行と行の間。音声からは前後の無音を削ってあるので、続けて鳴らすと
     切れ目が無くなる。話者が代わる間としてここで空ける。 */
  var LINE_GAP = 450;

  function replayAll() {
    stopPlay(); chain = true;
    (function next(i) {
      if (!chain || i >= lines().length) { chain = false; setBar(0); markLine(-1); return; }
      speakLine(i, function () {
        if (!chain) return;
        setTimeout(function () { if (chain) next(i + 1); }, LINE_GAP);
      });
    })(0);
  }

  /* ---- 語注ポップ ---- */

  var pop = null, popWord = null;

  function closePop() {
    if (pop) { pop.remove(); pop = null; }
    if (popWord) { popWord.classList.remove('open'); popWord = null; }
  }
  function contextOf(el) {
    var host = el.closest('.line');
    if (!host) return '';
    var c = host.cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll('.j, .tag'), function (n) { n.remove(); });
    return (c.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 400);
  }
  function hasAI() { try { return !!(T.AI && T.AI.enabled()); } catch (e) { return false; } }

  function openPop(el) {
    closePop();
    var k = el.dataset.w, raw = el.dataset.raw;
    var g = SET.glossary && SET.glossary[k];
    var aiData = null;

    popWord = el; el.classList.add('open');
    pop = document.createElement('div');
    pop.className = 'pop';
    pop.dataset.word = raw;

    var addTerm = (g && g.lemma) || raw;
    var inBook = T.Vocab.has(addTerm);
    var glossHTML = g
      ? '<div class="ja">' + (g.pos ? '<span class="muted small">(' + esc(g.pos) + ') </span>' : '') + esc(g.ja) + '</div>' +
        (g.note ? '<div class="note">' + esc(g.note) + '</div>' : '')
      : '<div class="note">この語の語注はありません。</div>';
    var row = '<div class="row">' +
      '<button class="btn btn-sm icon' + (inBook ? ' on' : '') + '" data-add="' + esc(addTerm) + '" title="' +
        (inBook ? '語彙帳から外す' : '語彙帳に追加') + '">' + (inBook ? '★' : '☆') + '</button>' +
      '<button class="btn btn-sm icon" data-sayw="' + esc(raw) + '" title="発音を聞く">🔊</button></div>';
    var mid = hasAI()
      ? '<div class="pop-ai-b muted small">照会中…</div>'
      : glossHTML + '<div class="pop-hint">⚙ で Gemini のキーを設定すると、この文での使われ方も出ます。</div>';

    pop.innerHTML = '<div class="term">' + esc(raw) + '</div>' + mid + row;
    document.body.appendChild(pop);

    var r = el.getBoundingClientRect();
    pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
    var lf = Math.min(r.left + window.scrollX,
      window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 12);
    pop.style.left = Math.max(window.scrollX + 12, lf) + 'px';

    if (hasAI()) {
      var ctx = contextOf(el), mine = raw;
      T.AI.lookup(raw, ctx, SET.id).then(function (rr) {
        if (!pop || pop.dataset.word !== mine) return;
        var b = pop.querySelector('.pop-ai-b'); if (!b) return;
        aiData = rr; b.className = 'pop-ai-b';
        b.innerHTML =
          (rr.ja ? '<div class="pop-ai-ja">' + (rr.pos ? '<span class="muted small">(' + esc(rr.pos) + ') </span>' : '') +
            esc(rr.ja) + '</div>' : '') +
          (rr.tip ? '<div class="pop-ai-u">' + esc(rr.tip) + '</div>' : '');
      }).catch(function (err) {
        if (!pop || pop.dataset.word !== mine) return;
        var b = pop.querySelector('.pop-ai-b');
        if (b) b.outerHTML = glossHTML + '<div class="pop-hint">' + esc((err && err.message) || '取得できませんでした') + '</div>';
      });
    }

    pop.addEventListener('click', function (ev) {
      var a = ev.target.closest('[data-add]');
      if (a) {
        var term2 = a.dataset.add;
        if (!T.Vocab.has(term2)) {
          var m = g || aiData || {};
          T.Vocab.add({ term: term2, pos: m.pos || '', ja: m.ja || '',
                        gloss: (g && g.note) || (aiData && aiData.tip) || '',
                        src: SET.id, srcTitle: 'Part 3 ' + (SET.scene || '') });
          T.toast('語彙帳に追加しました');
        } else { T.Vocab.remove(term2); T.toast('語彙帳から外しました'); }
        closePop(); return;
      }
      var sy = ev.target.closest('[data-sayw]');
      if (sy) { stopPlay(); T.TTS.speak(sy.dataset.sayw, { rate: 0.85 }); }
    });
  }

  document.addEventListener('click', function (e) {
    if (pop && !pop.contains(e.target) && !e.target.closest('.w')) closePop();
  }, true);

  /* ================= セットを選ぶ・設定 ================= */

  $('btnPick').addEventListener('click', function () {
    var rows = INDEX.length ? INDEX.map(function (it) {
      var here = SET && it.id === SET.id;
      var p = T.Log.progress('part3:' + it.id);
      return '<p style="margin:0 0 4px"><a href="?id=' + encodeURIComponent(it.id) + '" style="color:inherit;text-decoration:none">' +
        '<span class="chip chip-plain">' + esc((it.date || it.id) + (it.time ? ' ' + it.time : '')) + '</span> ' +
        (it.speakers ? '<span class="chip">' + esc(it.speakers) + '人</span> ' : '') +
        (here ? '<b>いま解いている</b>' : (p && p.scored ? '解答済み' : '未着手')) + '</a></p>';
    }).join('') : '<p class="muted small">目次が読めませんでした。</p>';
    T.modal('<h2>セットを選ぶ</h2>' + rows +
      '<div class="tool-row"><button class="btn btn-sm" id="mClose">閉じる</button></div>',
      function (bg) { bg.querySelector('#mClose').onclick = function () { bg.remove(); }; });
  });

  /* 全部作ると何回の呼び出しになるか。core.js が古ければ ? と出す */
  function calls() {
    try { return T.AI && T.AI.audioCalls ? T.AI.audioCalls(lines()) : '?'; }
    catch (e) { return '?'; }
  }

  $('btnCfg').addEventListener('click', function () {
    T.openSettings({
      extraHTML:
        '<h2>Part 3</h2>' +
        '<label class="field"><span>設問の先読み <b id="p3v">' + prepSec() + '</b> 秒</span>' +
          '<input type="range" id="p3prep" min="5" max="30" step="1" value="' + prepSec() + '"></label>' +
        '<label class="field"><span>設問ごとの間 <b id="p3av">' + (ansSec() || 0) + '</b> 秒</span>' +
          '<input type="range" id="p3ans" min="0" max="20" step="1" value="' + ansSec() + '"></label>' +
        '<p class="small muted" style="margin:-4px 0 8px">本番は各設問の読み上げのあとに約8秒の間があります。' +
        '慣れるまで長めにしても構いません。<b>0 にすると3問を続けて読み上げます</b>（速く回したいとき用）。</p>' +
        '<hr class="sep">' +
        '<h2>音声を Gemini で作る（試験中）</h2>' +
        '<p class="small muted" style="margin:-6px 0 8px">端末内蔵の読み上げより自然かどうかを確かめる試聴です。' +
        '1回の呼び出しで指定できる声は<b>2人まで</b>。3人の会話は2人ずつのかたまりに切って繋ぎます。' +
        '<b>無料枠は分あたりの回数がごく小さい</b>ので、まず「冒頭だけ」で音の質を確かめてください。' +
        'アクセント（米・英・豪）の指定はできません。</p>' +
        '<label class="field"><span>TTS のモデル</span>' +
          '<input type="text" id="ttsModel" value="' + esc(T.AI.ttsCfg().model) + '"></label>' +
        '<div class="tool-row">' +
          '<button class="btn btn-sm btn-primary" id="ttsHead">冒頭だけ試聴（1回）</button>' +
          '<button class="btn btn-sm" id="ttsTry">全部作る（' + calls() + '回）</button>' +
        '</div>' +
        '<div class="small muted" id="ttsInfo" style="margin-top:8px"></div>' +
        '<div id="ttsOut" style="margin-top:8px"></div>',
      onMount: function (bg) {
        var r1 = bg.querySelector('#p3prep');
        r1.oninput = function () {
          T.Settings.set('p3prep', parseInt(r1.value, 10));
          bg.querySelector('#p3v').textContent = r1.value;
        };
        var r2 = bg.querySelector('#p3ans');
        r2.oninput = function () {
          T.Settings.set('p3ans', parseInt(r2.value, 10));
          bg.querySelector('#p3av').textContent = r2.value;
        };

        var tm = bg.querySelector('#ttsModel');
        tm.onchange = function () { T.AI.setCfg({ ttsModel: tm.value.trim() }); };
        /* head = true なら冒頭のかたまり1つだけ。無料枠を使い切らずに音の質だけ見る用 */
        var run = function (head) {
          var info = bg.querySelector('#ttsInfo'), out = bg.querySelector('#ttsOut');
          if (!T.AI.enabled()) { info.textContent = '先に Gemini の API キーを設定してください。'; return; }
          if (!T.AI.audioCalls) { info.textContent = 'core.js が古いようです。ページを再読み込みしてください。'; return; }
          T.AI.setCfg({ ttsModel: tm.value.trim() });
          out.innerHTML = '';

          var ls = lines();
          if (head) {
            /* 先頭から、出てくる話者が3人目になる手前まで */
            var seen = [], cut = ls.length;
            for (var i = 0; i < ls.length; i++) {
              if (seen.indexOf(ls[i].tag) < 0) {
                if (seen.length >= 2) { cut = i; break; }
                seen.push(ls[i].tag);
              }
            }
            ls = ls.slice(0, cut);
          }

          var t0 = Date.now();
          info.textContent = '作成中…';
          T.AI.conversationAudio(ls, SET.speakers, function (done, total) {
            info.textContent = '作成中… ' + done + ' / ' + total + ' 回';
          }).then(function (blob) {
            var sec = ((Date.now() - t0) / 1000).toFixed(1);
            info.innerHTML = '完了。' + ls.length + '行 ／ <b>' + Math.round(blob.size / 1024) + ' KB</b>（WAV）' +
              '／ 作成 ' + sec + ' 秒。<br>MP3 に変換すれば 1/5 ほどになります。';
            var a = document.createElement('audio');
            a.controls = true; a.style.width = '100%';
            a.src = URL.createObjectURL(blob);
            out.appendChild(a);
          }).catch(function (e) {
            info.textContent = '失敗: ' + ((e && e.message) || e);
          });
        };
        bg.querySelector('#ttsHead').onclick = function () { run(true); };
        bg.querySelector('#ttsTry').onclick = function () { run(false); };
      }
    });
  });

  /* 文中をなぞって選ぶと「意味」のボタンが出る。熟語はタップでは指せないため */
  T.watchSelection(stage, {
    ctx: '.line, .evid-line, .qprompt, .choice',
    onPick: function (text, ctx, rect) {
      var g = SET && SET.glossary && SET.glossary[text.toLowerCase()];
      T.phrasePop({ text: text, ctx: ctx, rect: rect, gloss: g,
        scope: (SET && SET.id) || '', srcTitle: 'Part 3 ' + ((SET && SET.scene) || '') });
    }
  });

  boot();
})();
</script>
</body>
</html>
