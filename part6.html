<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="app-build" content="2026-09-18 3d0e5ca">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Part 6 | TOEIC Daily</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="style.css?v=4591a5f7">
<style>
body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}

.app-head{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:6px;padding:7px 0 0}
.head-row .grow{flex:1;min-width:0}
.head-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.head-scene{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.35}
.rail{display:flex;gap:3px;padding:8px 0 6px}
.rail button{
  flex:1;padding:0;border:0;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;
}
.rail .bar{width:100%;height:4px;border-radius:2px;background:var(--line)}
.rail button.done .bar,.rail button.cur .bar{background:var(--accent)}
.rail .t{font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.rail button.cur .t{color:var(--accent);font-weight:800}

.stage{padding-top:14px}

/* 前置き（本番の Directions にあたる1行） */
.intro{padding:11px 14px}
.intro .sec-label{margin-bottom:4px}
.intro-en{margin:0;font-family:var(--serif);font-size:13.5px;line-height:1.55;color:var(--ink-2)}

/* 文書 */
.doc{padding:16px 14px}
.dhead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.drow{display:flex;gap:8px;font-size:13px;line-height:1.7}
.drow .dl{flex:none;width:58px;color:var(--muted);font-weight:700}
.drow .dt{flex:1;min-width:0;font-family:var(--serif)}
.drow.plain .dt{font-weight:700;font-size:14.5px}
.dpara{font-family:var(--serif);font-size:15.5px;line-height:1.95;margin:0 0 14px}
.dpara:last-child{margin-bottom:0}
/* 空所。番号を添えた下線で本番の見た目に寄せる */
.blank{
  display:inline-block;min-width:66px;border-bottom:2px solid var(--muted);
  vertical-align:2px;margin:0 3px;text-align:center;
}
.blank i{font-style:normal;font-size:11px;font-weight:800;color:var(--accent);
  position:relative;top:-4px;letter-spacing:.02em}
.blank.wide{display:block;min-width:0;width:100%;margin:6px 0}
.fill{background:var(--ok-soft);color:var(--ok);font-weight:700;border-radius:4px;padding:0 4px}

/* 設問 */
.qbox{margin-top:12px}
.qnum{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent);margin-bottom:5px}
.choice{
  display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;white-space:normal;
  padding:10px 12px;margin-top:7px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer;min-height:42px;
}
.choice .k{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line-2);font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.choice .t{font-family:var(--serif);font-size:15px;line-height:1.55}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice.ng .k{background:var(--ng);border-color:var(--ng);color:#fff}

/* 結果 */
.score-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 12px;margin-top:14px;
}
.score-bar .lb{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.score-bar .n{font-size:15px;font-weight:800;letter-spacing:-.01em}
.score-bar .sub{font-size:11.5px;color:var(--muted);font-weight:700}
.verdict{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng)}
.verdict.na{background:var(--surface-2);color:var(--muted)}
.qsent{font-family:var(--serif);font-size:15px;line-height:1.8;margin:0 0 10px;
  padding-left:10px;box-shadow:inset 3px 0 0 var(--mark)}
.expl{font-size:14px;margin:8px 0 0;line-height:1.75}
.tip{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.75;margin-top:10px}
.tip b{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.qhead .qnum{margin:0;flex:1;min-width:0}

/* 対訳 */
.line{display:flex;gap:9px;align-items:flex-start;padding:7px 6px;border-radius:8px}
.line .tag{
  flex:none;width:22px;height:20px;border-radius:5px;background:var(--surface-2);
  border:1px solid var(--line);font-size:10px;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.line .body{flex:1;min-width:0}
.line .e{display:block;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.line .j{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.line .pl{
  flex:none;align-self:flex-start;margin-top:2px;
  width:26px;height:26px;padding:0;border-radius:8px;
  border:1px solid var(--line-2);background:var(--surface);
  color:var(--accent);font-size:10px;line-height:1;cursor:pointer;
}
.line.play{background:var(--mark-soft)}
.hide-ja .line .j{display:none}
.pbreak{height:10px}

/* 語彙 */
.vcard{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
.vcard:first-child{padding-top:0}
.vcard:last-child{border-bottom:0;padding-bottom:0}
.vcard .no{
  flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface-2);
  color:var(--muted);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.vcard .body{flex:1;min-width:0}
.vterm{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.25}
.vpos{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}
.vja{font-size:14.5px;margin-top:2px}
.vgloss{font-size:12.5px;color:var(--muted);margin-top:1px}
.say-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;padding:0;border-radius:7px;vertical-align:2px;
  border:1px solid var(--line-2);background:var(--surface);
  color:var(--accent);font-size:9px;line-height:1;cursor:pointer;
}
.vterm .say-btn{margin:0 6px 0 8px}
.terms-only .vja,.terms-only .vgloss{display:none}
.terms-only .vcard.open .vja,.terms-only .vcard.open .vgloss{display:block}
.terms-only .vcard{cursor:pointer}
.star{
  flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;
}
.star.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark-ink)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.sec-head .sec-label{margin:0}
.sec-tools{display:flex;gap:6px;flex:none}

/* Point */
.point .lead{font-size:14.5px;font-weight:700;line-height:1.7;margin:0}
.point h3{
  margin:26px 0 8px;font-size:15px;color:var(--accent-ink);line-height:1.5;
  padding-top:16px;border-top:1px solid var(--line);
}
.point h3:first-of-type{margin-top:18px}
.point p{margin:0;font-size:14px;line-height:1.8}

.app-foot{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding:5px 0 calc(5px + env(safe-area-inset-bottom));
}
.app-foot .bar{
  position:absolute;left:0;top:0;height:3px;width:0;
  background:var(--mark);transition:width .25s linear;
}
.foot-row{display:flex;align-items:center;gap:8px}
.foot-row .mid{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.foot-row .mid.over{color:var(--ng)}
.foot-row .btn{min-width:80px;min-height:36px;padding:6px 12px;font-size:13.5px}
</style>
</head>
<body>

<header class="app-head">
  <div class="wrap">
    <div class="head-row">
      <div class="grow">
        <div class="head-meta" id="meta"></div>
        <div class="head-scene" id="scene">読み込み中…</div>
      </div>
      <a class="icon-btn" href="index.html?tab=drill" title="ホーム">⌂</a>
      <button class="icon-btn" id="btnFinish" title="終えてホームへ">✓</button>
      <button class="icon-btn" id="btnPick" title="セットを選ぶ">▤</button>
      <button class="icon-btn" id="btnCfg" title="設定">⚙</button>
    </div>
    <div class="rail" id="rail"></div>
  </div>
</header>

<main class="wrap stage" id="stage"></main>

<nav class="app-foot">
  <i class="bar" id="fbar"></i>
  <div class="wrap foot-row">
    <button class="btn" id="btnPrev">← Back</button>
    <div class="mid" id="footMid"></div>
    <button class="btn btn-primary" id="btnNext">Next →</button>
  </div>
</nav>

<script src="core.js?v=deb8b121"></script>
<script>
(function () {
  'use strict';
  var T = window.TOEIC, esc = T.esc;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  /* 1回に1セット（文書1本＋空所4つ）。本番の1セットと同じ単位。
     4問のうち1問は一文挿入で、文書に合う1文を選ぶ。 */
  T.Settings.set('hubTab', 'drill');

  var STEPS = [
    { key: 'quiz',   label: '設問' },
    { key: 'ans',    label: '解説' },
    { key: 'script', label: '対訳' },
    { key: 'vocab',  label: '語彙' },
    { key: 'point',  label: 'Point' }
  ];

  var SET = null, INDEX = [];
  var step = 0, maxStep = 0;
  var ans = {}, scored = false, done = false;
  var fresh = {};
  var progKey = '';

  var t0 = 0, sec = 0, timer = null;
  var PACE_DEFAULT = 30;   /* 本番は1文書2分ほど。4問なので1問30秒 */
  var TYPE_LABEL = {
    sentence: '一文挿入', form: '品詞', verb: '動詞の形', verbal: '準動詞', prep: '前置詞',
    conj: '接続', pron: '代名詞・指示語', comp: '比較・数量', vocab: '語彙'
  };
  var DOC_LABEL = {
    email: 'メール', memo: '社内連絡', notice: '掲示', article: '記事',
    advertisement: '広告', letter: '手紙', instructions: '説明書'
  };
  var BLANK = /-{4,}/;

  /* ================= 起動 ================= */

  function fetchJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + url);
      return r.json();
    });
  }

  function boot() {
    var want = new URLSearchParams(location.search).get('id');
    fetchJSON('data/part6/index.json')
      .then(function (idx) { INDEX = (idx && idx.items) || []; })
      .catch(function () { INDEX = []; })
      .then(function () {
        INDEX.sort(function (a, b) { return (b.id || '').localeCompare(a.id || ''); });
        var it = INDEX.filter(function (x) { return x.id === want; })[0] || INDEX[0];
        if (!it) throw new Error('セットが見つかりません');
        return fetchJSON('data/part6/' + (it.file || (it.id + '.json')));
      })
      .then(start)
      .catch(fail);
  }

  function fail(e) {
    $('scene').textContent = '読み込めません';
    $('rail').innerHTML = '';
    stage.innerHTML = '<div class="card"><div class="sec-label">読み込めません</div><p>' +
      esc(e && e.message || e) + '</p>' +
      '<p class="small muted">Part 6 の教材はまだ作られていないかもしれません。' +
      'ルーティンが <code>data/part6/</code> に書き出すと、ここに出ます。</p></div>';
    $('btnNext').disabled = true;
    $('btnPrev').disabled = true;
  }

  function start(d) {
    SET = d;
    progKey = 'part6:' + (d.id || 'unknown');
    var p = T.Log.progress(progKey);
    done = !!(p && (p.done || p.maxStep >= STEPS.length - 1));
    ans = (p && p.answers) || {};
    scored = !!(p && p.scored);
    maxStep = (p && p.maxStep) || 0;
    sec = (p && p.sec) || 0;
    fresh = {};
    step = 0;
    renderHead();
    render('top');
    startClock();
  }

  function qs() { return (SET && SET.questions) || []; }
  function paras() { return (SET && SET.paragraphs) || []; }

  /* 文書の文を上から1列に並べる。対訳と読み上げで使う */
  function flat() {
    var out = [];
    paras().forEach(function (p, pi) {
      (p.sentences || []).forEach(function (s) { out.push({ s: s, p: pi }); });
    });
    return out;
  }

  function answerOf(n) {
    var q = qs()[n - 1];
    if (!q) return null;
    return (q.choices || []).filter(function (c) { return c.key === q.answer; })[0] || null;
  }

  /* 空所を正解で埋めた1文。一文挿入の空所は、その選択肢の文と訳をそのまま使う */
  function filled(s) {
    var c = s.q ? answerOf(s.q) : null;
    var en = String(s.en || '');
    if (/^-{4,}$/.test(en.trim())) {
      return { en: c ? c.text : '', ja: c ? c.ja : '', fill: c ? c.text : '' };
    }
    return { en: c ? en.replace(BLANK, c.text) : en, ja: s.ja || '', fill: c ? c.text : '' };
  }

  function paceSec() {
    var v = T.Settings.get('p6pace');
    return (typeof v === 'number' && v > 0) ? v : PACE_DEFAULT;
  }
  function target() { return paceSec() * qs().length; }

  function save() {
    T.Log.saveProgress(progKey, {
      answers: ans, scored: scored, maxStep: maxStep, done: done,
      date: SET.date, scene: SET.scene, sec: sec
    });
  }

  /* ================= 時間 ================= */

  function startClock() {
    stopClock();
    if (step !== 0 || scored) return;
    t0 = Date.now() - sec * 1000;
    timer = setInterval(function () {
      sec = Math.round((Date.now() - t0) / 1000);
      paintFoot();
    }, 1000);
  }
  function stopClock() { clearInterval(timer); timer = null; }
  function mmss(n) {
    var m = Math.floor(n / 60), s = n % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ================= ヘッダー ================= */

  function renderHead() {
    var m = [];
    if (SET.date) m.push('<span>' + esc(SET.date.replace(/-/g, '/')) + (SET.time ? ' ' + esc(SET.time) : '') + '</span>');
    m.push('<span class="chip">Part 6</span>');
    if (DOC_LABEL[SET.docType]) m.push('<span class="chip chip-plain">' + esc(DOC_LABEL[SET.docType]) + '</span>');
    if (SET.sample) m.push('<span class="chip chip-mark">サンプル</span>');
    $('meta').innerHTML = m.join('');
    /* Part 6 は読む問題なので、場面は最初から出す（伏せても意味がない） */
    $('scene').textContent = SET.scene || '';
    renderRail();
  }

  function renderRail() {
    $('rail').innerHTML = STEPS.map(function (s, i) {
      var cls = i === step ? 'cur' : (i <= maxStep ? 'done' : '');
      return '<button data-i="' + i + '" class="' + cls + '">' +
        '<span class="bar"></span><span class="t">' + esc(s.label) + '</span></button>';
    }).join('');
  }

  $('rail').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]');
    if (b) go(+b.dataset.i);
  });

  function go(i) {
    stopPlay();
    step = Math.max(0, Math.min(i, STEPS.length - 1));
    maxStep = Math.max(maxStep, step);
    if (step > 0 && !scored) { scored = true; T.Log.touchToday(); }
    if (step === 0 && !scored) startClock(); else stopClock();
    save();
    renderHead();
    render('top');
  }

  /* ================= 文書の描き方 ================= */

  function headerHTML() {
    var h = SET.header || [];
    if (!h.length) return '';
    return '<div class="dhead">' + h.map(function (r) {
      return '<div class="drow' + (r.label ? '' : ' plain') + '">' +
        (r.label ? '<span class="dl">' + esc(r.label) + '</span>' : '') +
        '<span class="dt">' + esc(r.text) + '</span></div>';
    }).join('') + '</div>';
  }

  /* 空所のまま出す。番号を添えて、どの設問かが分かるようにする */
  function docHTML() {
    return '<div class="card doc">' + headerHTML() +
      paras().map(function (p) {
        return '<p class="dpara">' + (p.sentences || []).map(function (s) {
          var en = String(s.en || '');
          if (/^-{4,}$/.test(en.trim())) {
            return '<span class="blank wide"><i>' + s.q + '</i></span>';
          }
          var html = T.markupEnglish(en, SET.glossary);
          if (s.q) html = html.replace(BLANK, '<span class="blank"><i>' + s.q + '</i></span>');
          return html;
        }).join(' ') + '</p>';
      }).join('') + '</div>';
  }

  function viewQuiz() {
    return '<div class="card intro"><span class="sec-label">Directions</span>' +
      '<p class="intro-en">' + esc(SET.intro || '') + '</p></div>' +
      docHTML() +
      qs().map(function (q, i) {
        return '<div class="card qbox" data-qi="' + i + '">' +
          '<div class="qnum">Q' + (i + 1) + '</div>' +
          q.choices.map(function (c) {
            var sel = fresh[q.id] === c.key;
            return '<button class="choice' + (sel ? ' sel' : '') + '" data-q="' + esc(q.id) + '" data-k="' + esc(c.key) + '">' +
              '<span class="k">' + esc(c.key) + '</span><span class="t">' + esc(c.text) + '</span></button>';
          }).join('') +
          '</div>';
      }).join('');
  }

  /* 解説で引用する、その空所の1文（正解を入れて色を付ける） */
  function sentenceOf(n) {
    var hit = null;
    flat().forEach(function (x) { if (x.s.q === n) hit = x.s; });
    if (!hit) return '';
    var c = answerOf(n);
    var en = String(hit.en || '');
    if (/^-{4,}$/.test(en.trim())) {
      return '<span class="fill">' + T.markupEnglish(c ? c.text : '', SET.glossary) + '</span>';
    }
    var html = T.markupEnglish(en, SET.glossary);
    return html.replace(BLANK, '<span class="fill">' +
      T.markupEnglish(c ? c.text : '', SET.glossary) + '</span>');
  }

  function viewAns() {
    var list = qs();
    var n = list.filter(function (q) { return ans[q.id] === q.answer; }).length;
    var html = '<div class="score-bar"><span class="lb">結果</span>' +
      '<span class="n">' + n + ' / ' + list.length + '</span>' +
      '<span class="verdict ' + (n === list.length ? 'ok' : 'ng') + '">' +
      (n === list.length ? '全問正解' : (list.length - n) + '問 要復習') + '</span>' +
      (sec ? '<span class="sub">所要 ' + mmss(sec) + '</span>' : '') +
      '</div>';

    list.forEach(function (q, i) {
      var mine = ans[q.id], ok = mine === q.answer;
      html += '<div class="card">' +
        '<div class="qhead"><span class="qnum">Q' + (i + 1) +
          (TYPE_LABEL[q.type] ? '　' + TYPE_LABEL[q.type] : '') + '　' +
          (!mine ? '<span class="verdict na">未解答</span>'
                 : '<span class="verdict ' + (ok ? 'ok' : 'ng') + '">' + (ok ? '正解' : '不正解') + '</span>') +
        '</span></div>' +
        '<p class="qsent">' + sentenceOf(i + 1) + '</p>' +
        q.choices.map(function (c) {
          var cls = c.key === q.answer ? ' ok' : (c.key === mine ? ' ng' : '');
          return '<button class="choice' + cls + '" disabled>' +
            '<span class="k">' + esc(c.key) + '</span>' +
            '<span class="t">' + esc(c.text) +
            (c.ja ? '<span class="cja">' + esc(c.ja) + '</span>' : '') +
            '</span></button>';
        }).join('') +
        '<p class="expl">' + esc(q.explanation || '') + '</p>' +
        (q.tip ? '<div class="tip"><b>この型の見分け方</b>' + esc(q.tip) + '</div>' : '') +
        '</div>';
    });
    return html;
  }

  function viewScript() {
    var showJa = T.Settings.get('showJa');
    var rows = flat();
    return '<div class="card' + (showJa ? '' : ' hide-ja') + '" id="scriptCard">' +
      '<div class="sec-head"><span class="sec-label">対訳</span>' +
        '<span class="sec-tools">' +
          '<button class="btn btn-sm icon" id="replay" title="通して再生">▶</button>' +
          '<button class="btn btn-sm icon" id="stopBtn" title="停止">■</button>' +
          '<button class="btn btn-sm icon' + (showJa ? ' on' : '') + '" id="toggleJa" title="' +
            (showJa ? '和訳を隠す' : '和訳を出す') + '">訳</button>' +
        '</span></div>' +
      rows.map(function (x, i) {
        var f = filled(x.s);
        var br = (i > 0 && rows[i - 1].p !== x.p) ? '<div class="pbreak"></div>' : '';
        return br + '<div class="line" data-i="' + i + '">' +
          '<span class="tag">' + (i + 1) + '</span>' +
          '<span class="body"><span class="e">' + T.markupEnglish(f.en, SET.glossary) + '</span>' +
          '<span class="j">' + esc(f.ja) + '</span></span>' +
          '<button class="pl" data-play="' + i + '" title="この文を再生">▶</button></div>';
      }).join('') +
      '</div><p class="hint">空所は正解を入れた形にしてあります。' +
      '文をタップすると語注が出ます。</p>';
  }

  function viewVocab() {
    var g = SET.glossary || {};
    var keys = Object.keys(g);
    if (!keys.length) return '<div class="card"><p class="small muted" style="margin:0">この文書には語注がありません。</p></div>';
    var showMean = T.Settings.get('vocabJa') !== false;
    return '<div class="card' + (showMean ? '' : ' terms-only') + '" id="vocabCard">' +
      '<div class="sec-head"><span class="sec-label">Vocabulary</span>' +
        '<span class="sec-tools"><button class="btn btn-sm icon' + (showMean ? ' on' : '') +
          '" id="toggleVocabJa" title="' + (showMean ? '英単語だけにする' : '意味を出す') + '">訳</button></span></div>' +
      keys.map(function (k, i) {
        var e = g[k], term = e.lemma || k;
        var on = T.Vocab.has(term);
        return '<div class="vcard">' +
          '<span class="no">' + (i + 1) + '</span>' +
          '<div class="body">' +
            '<div class="vterm">' + esc(term) +
              '<button class="say-btn" data-sayw="' + esc(term) + '" title="単語を再生">▶</button>' +
              (e.pos ? '<span class="vpos">（' + esc(e.pos) + '）</span>' : '') + '</div>' +
            '<div class="vja">' + esc(e.ja || '') + '</div>' +
            (e.note ? '<div class="vgloss">' + esc(e.note) + '</div>' : '') +
          '</div>' +
          '<button class="star' + (on ? ' on' : '') + '" data-term="' + esc(term) + '" title="語彙帳">' +
            (on ? '★' : '☆') + '</button></div>';
      }).join('') +
      '</div><p class="hint">' +
      (showMean
        ? '★ で<a href="vocab.html" style="color:var(--accent)">語彙帳</a>に入り、間隔をあけて復習できます。現在 ' + T.Vocab.count() + ' 語。'
        : '英単語だけを出しています。意味を思い出してから、カードをタップして答え合わせ。') + '</p>';
  }

  function viewPoint() {
    var p = SET.point;
    if (!p || !(p.items || []).length) {
      return '<div class="card"><p class="small muted" style="margin:0">' +
        'このセットには総括がありません。設問ごとの見分け方は解説にあります。</p></div>';
    }
    return '<div class="card point">' +
      '<div class="sec-label">読み方の型</div>' +
      '<p class="lead">' + esc(p.lead || '') + '</p>' +
      '<p class="small muted" style="margin:6px 0 0">Part 6 は、空所の文だけでは決まらない問題が必ず入ります。</p>' +
      p.items.map(function (it) {
        return '<h3>' + esc(it.title) + '</h3><p>' + esc(it.body) + '</p>';
      }).join('') +
      '</div>';
  }

  function render(scroll) {
    var k = STEPS[step].key;
    stage.innerHTML =
      k === 'quiz' ? viewQuiz() :
      k === 'ans' ? viewAns() :
      k === 'script' ? viewScript() :
      k === 'vocab' ? viewVocab() : viewPoint();
    paintFoot();
    if (scroll === 'top') window.scrollTo(0, 0);
  }

  /* ================= 読み上げ =================
     端末（Chrome / Edge）の読み上げで鳴らす。音声ファイルは持たない。
     読ませるのは空所を正解で埋めた文。 */

  var chain = false;

  function markPlay(i) {
    var els = stage.querySelectorAll('.line[data-i]');
    for (var k = 0; k < els.length; k++) els[k].classList.toggle('play', +els[k].dataset.i === i);
    if (i >= 0 && chain) {
      var c = stage.querySelector('.line[data-i="' + i + '"]');
      if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
  function stopPlay() { chain = false; T.TTS.cancel(); markPlay(-1); }

  function speakOne(i, onend) {
    var x = flat()[i];
    if (!x) { if (onend) onend(); return; }
    markPlay(i);
    T.TTS.speak(filled(x.s).en, { rate: T.Settings.get('rate'), onend: onend });
  }
  function playOne(i) {
    stopPlay();
    speakOne(i, function () { markPlay(-1); });
  }
  var GAP = 500;
  function playAll() {
    stopPlay();
    chain = true;
    (function next(i) {
      if (!chain || i >= flat().length) { chain = false; markPlay(-1); return; }
      speakOne(i, function () {
        if (!chain) return;
        setTimeout(function () { if (chain) next(i + 1); }, GAP);
      });
    })(0);
  }

  /* ================= フッター ================= */

  function answered() {
    return qs().filter(function (q) { return fresh[q.id]; }).length;
  }

  function paintFoot() {
    var prev = $('btnPrev'), next = $('btnNext'), mid = $('footMid'), bar = $('fbar');
    prev.textContent = step === 0 ? '← Home' : '← Back';
    next.textContent = step === 0 ? 'Check' : (step === STEPS.length - 1 ? 'Finish' : 'Next →');

    if (step === 0) {
      var n = answered(), total = qs().length;
      bar.style.width = (total ? (n / total) * 100 : 0) + '%';
      mid.textContent = n + ' / ' + total + '　' + mmss(sec) + ' ／ ' + mmss(target());
      mid.classList.toggle('over', sec > target());
      return;
    }
    bar.style.width = '100%';
    mid.classList.remove('over');
    mid.textContent = (step + 1) + ' / ' + STEPS.length + '　' + STEPS[step].label;
  }

  /* ================= 操作 ================= */

  $('btnNext').addEventListener('click', function () {
    if (step === STEPS.length - 1) { finish(); return; }
    go(step + 1);
  });

  $('btnPrev').addEventListener('click', function () {
    if (step > 0) { go(step - 1); return; }
    stopClock();
    stopPlay();
    location.href = 'index.html?tab=drill';
  });

  $('btnFinish').addEventListener('click', finish);

  function finish() {
    stopClock();
    stopPlay();
    if (!scored) { scored = true; T.Log.touchToday(); }
    maxStep = STEPS.length - 1;
    done = true;
    save();
    if (T.flash) T.flash('Done');
    location.href = 'index.html?tab=drill';
  }

  stage.addEventListener('click', function (e) {
    var t = e.target;

    var ch = t.closest('.choice[data-q]');
    if (ch && !ch.disabled) {
      ans[ch.dataset.q] = ch.dataset.k;
      fresh[ch.dataset.q] = ch.dataset.k;
      save();
      var box = ch.closest('.qbox');
      Array.prototype.forEach.call(box.querySelectorAll('.choice'), function (b) {
        b.classList.toggle('sel', b === ch);
      });
      paintFoot();
      return;
    }

    var pl = t.closest('.pl[data-play]');
    if (pl) { playOne(+pl.dataset.play); return; }
    if (t.closest('#replay')) { playAll(); return; }
    if (t.closest('#stopBtn')) { stopPlay(); return; }

    if (t.closest('#toggleJa')) {
      var show = !T.Settings.get('showJa');
      T.Settings.set('showJa', show);
      var card = $('scriptCard');
      if (card) card.classList.toggle('hide-ja', !show);
      var b2 = $('toggleJa');
      if (b2) { b2.classList.toggle('on', show); b2.title = show ? '和訳を隠す' : '和訳を出す'; }
      return;
    }

    var sw = t.closest('[data-sayw]');
    if (sw) { stopPlay(); T.TTS.speak(sw.dataset.sayw, { rate: 0.85 }); return; }

    var st = t.closest('.star[data-term]');
    if (st) {
      var term = st.dataset.term;
      var g = SET.glossary || {};
      var hit = null;
      Object.keys(g).forEach(function (k) { if ((g[k].lemma || k) === term) hit = g[k]; });
      if (T.Vocab.has(term)) { T.Vocab.remove(term); T.toast('語彙帳から外しました'); }
      else {
        T.Vocab.add({ term: term, pos: (hit && hit.pos) || '', ja: (hit && hit.ja) || '',
                      gloss: (hit && hit.note) || '', src: SET.id,
                      srcTitle: 'Part 6 ' + (SET.scene || '') });
        T.toast('語彙帳に追加しました');
      }
      render();
      return;
    }

    if (t.closest('#toggleVocabJa')) {
      T.Settings.set('vocabJa', T.Settings.get('vocabJa') === false);
      render();
      return;
    }

    var gw = t.closest('.vcard');
    if (gw && gw.closest('.terms-only')) { gw.classList.toggle('open'); return; }
  });

  /* ================= セットを選ぶ・設定 ================= */

  $('btnPick').addEventListener('click', function () {
    var rows = INDEX.length ? INDEX.map(function (it) {
      var here = SET && it.id === SET.id;
      var p = T.Log.progress('part6:' + it.id);
      return '<p style="margin:0 0 4px"><a href="?id=' + encodeURIComponent(it.id) + '" style="color:inherit;text-decoration:none">' +
        '<span class="chip chip-plain">' + esc((it.date || it.id) + (it.time ? ' ' + it.time : '')) + '</span> ' +
        (it.kind ? '<span class="chip">' + esc(it.kind) + '</span> ' : '') +
        (here ? '<b>いま解いている</b>' : (p && p.scored ? '解答済み' : '未着手')) + '</a></p>';
    }).join('') : '<p class="muted small">目次が読めませんでした。</p>';
    T.modal('<h2>セットを選ぶ</h2>' + rows +
      '<div class="tool-row"><button class="btn btn-sm" id="mClose">閉じる</button></div>',
      function (bg) { bg.querySelector('#mClose').onclick = function () { bg.remove(); }; });
  });

  $('btnCfg').addEventListener('click', function () {
    T.openSettings({
      extraHTML:
        '<h2>Part 6</h2>' +
        '<label class="field"><span>1問あたりの目安 <b id="p6v">' + paceSec() + '</b> 秒</span>' +
          '<input type="range" id="p6pace" min="15" max="60" step="5" value="' + paceSec() + '"></label>' +
        '<p class="small muted" style="margin:-4px 0 8px">本番は1文書あたり2分ほど（4問で1問30秒）。' +
          'フッターに経過時間と目安が出て、超えると赤くなります。<b>時間を過ぎても止まりません。</b></p>',
      onMount: function (bg) {
        var r = bg.querySelector('#p6pace');
        r.oninput = function () {
          T.Settings.set('p6pace', parseInt(r.value, 10));
          bg.querySelector('#p6v').textContent = r.value;
          paintFoot();
        };
      }
    });
  });

  T.watchSelection(stage, {
    ctx: '.dpara, .line, .qsent, .choice, .expl',
    onPick: function (text, ctx, rect) {
      var g = SET && SET.glossary && SET.glossary[text.toLowerCase()];
      T.phrasePop({ text: text, ctx: ctx, rect: rect, gloss: g,
        scope: (SET && SET.id) || '', srcTitle: 'Part 6 ' + ((SET && SET.scene) || '') });
    }
  });

  boot();
})();
</script>
</body>
</html>
