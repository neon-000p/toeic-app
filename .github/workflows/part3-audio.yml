name: 音声を作る

# data/ に新しい教材が入ったら、読み上げ音声を作って main に足す。
#   時事英語（data/news/）… 本文を1文ずつ
#   Part 3（data/part3/） … 会話まるごと ＋ 1行ずつ
#   Part 4（data/part4/） … 前置き＋トークまるごと ＋ 1文ずつ
#   Part 5（data/part5/） … 設問を1文ずつ（空所は正解で埋めて読む）
# API キーはリポジトリの Secret（GEMINI_API_KEY）から環境変数で渡すので、
# コードにも履歴にも残らない。手で動かしたいときは Actions の画面から実行できる。

on:
  push:
    branches: [main]
    paths:
      - 'data/news/*.json'
      - 'data/part3/*.json'
      - 'data/part4/*.json'
      - 'data/part5/*.json'
      - 'tools/make-audio.js'
      - 'tools/make-part4-audio.js'
      - 'tools/make-part5-audio.js'
      - 'tools/make-news-audio.js'
      - 'tools/tts-lib.js'
      - '.github/workflows/part3-audio.yml'
  # 作り損ねた音声を翌朝拾う。無料枠の上限に当たって途中で止まっても、
  # 次の日の実行で足りない分だけが作られる。古い教材の片づけもここで走る。
  schedule:
    - cron: '0 20 * * *'   # JST 5:00
  workflow_dispatch:
    inputs:
      force:
        description: 'すでに音声がある教材も作り直す'
        type: boolean
        default: false

permissions:
  contents: write

# GITHUB_TOKEN で push したコミットは新しいワークフローを起動しない
# （GitHub の仕様）ので、自分の push で動き続ける心配はない。

# 同時に走らせない。2つが同じファイルを書くと push がぶつかる
concurrency:
  group: audio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 鍵があるか確かめる
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret の GEMINI_API_KEY が未登録です。" \
                 "Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi

      # runner に ffmpeg は入っていない。MP3 にしないと1本2MB を超える
      - name: ffmpeg を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # 先に古いものを片づける。消す予定の教材の音声を作っても無駄になる
      - name: 古い教材を片づける
        run: node tools/prune.js

      - name: Part 3 の音声
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/make-audio.js --all ${{ inputs.force && '--force' || '' }}

      # どれかが上限に当たっても、残りは作らせる
      - name: Part 4 の音声
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/make-part4-audio.js --all ${{ inputs.force && '--force' || '' }}

      - name: Part 5 の音声
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/make-part5-audio.js --all ${{ inputs.force && '--force' || '' }}

      - name: 時事英語の音声
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/make-news-audio.js --all ${{ inputs.force && '--force' || '' }}

      # すでに置いてあるクリップの前後の無音を削る。API は呼ばない
      - name: 既存の音声を整える
        if: always()
        run: node tools/trim-existing.js

      - name: main に足す
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更はありません。何もしません"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "読み上げ音声を追加 [audio]"
          git push
