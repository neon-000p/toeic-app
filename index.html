<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOEIC Daily</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="style.css?v=136e9fdd">
<style>
body{padding-bottom:24px}
.hub-head{padding:22px 0 12px}
.hub-head h1{margin:0;font-size:22px;letter-spacing:.04em;font-weight:800}
.hub-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

.stats{display:flex;gap:10px;margin-top:16px}
.stats>*{
  flex:1;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 10px;text-align:center;
  text-decoration:none;color:inherit;display:block;
}
.stats .n{font-size:22px;font-weight:800;line-height:1.1}
.stats .l{font-size:11px;color:var(--muted);margin-top:3px}
a.stat .l{color:var(--accent)}

.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line)}
.tabs button{
  flex:1;padding:10px 4px;border:0;background:transparent;
  color:var(--muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-top:14px}

.today{display:block;text-decoration:none;color:inherit}
.today h2{margin:6px 0 0;font-size:17px;line-height:1.5}
.today .go{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  background:var(--accent);color:#fff;font-weight:700;font-size:14px;
  padding:10px 18px;border-radius:10px;
}
.meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.list a{
  display:flex;align-items:center;gap:10px;
  padding:12px 2px;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit;
}
.list a:last-child{border-bottom:0}
.list .d{flex:none;font-size:11px;font-weight:700;color:var(--muted);width:72px;line-height:1.35}
.list .t{flex:1;min-width:0;font-size:14px;line-height:1.5}
.list .s{flex:none;font-size:11px;font-weight:700;color:var(--accent)}
.list .s.done{color:var(--ok)}

.soon .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;font-size:14px}
.soon .row+.row{border-top:1px solid var(--line)}
.soon .row .w{color:var(--muted);font-size:12px}
.soon .row .name{color:var(--ink-2)}
</style>
</head>
<body>

<div class="wrap">
  <header class="hub-head">
    <h1>TOEIC Daily</h1>
    <div class="sub">時事英語と実践対策</div>
    <div class="stats">
      <div><div class="n" id="stStreak">0</div><div class="l">連続日数</div></div>
      <a class="stat" href="vocab.html"><div class="n" id="stVocab">0</div><div class="l">語彙帳 →</div></a>
      <div><div class="n" id="stDone">0</div><div class="l">学習した教材</div></div>
    </div>
    <div class="tabs">
      <button data-tab="news" class="on">時事</button>
      <button data-tab="drill">実践</button>
    </div>
  </header>

  <main id="main">
    <div class="card"><p class="muted small" style="margin:0">読み込み中…</p></div>
  </main>
</div>

<script src="core.js?v=d8e95294"></script>
<script>
(function () {
  'use strict';
  var T = window.TOEIC, esc = T.esc;
  var main = document.getElementById('main');
  var items = [];
  var tab = 'news';

  document.getElementById('stStreak').textContent = T.Log.streak();
  document.getElementById('stVocab').textContent = T.Vocab.count();

  function progressOf(id) { return T.Log.progress('news:' + id); }

  function statusLabel(p) {
    if (!p) return '';
    if (p.done) return '済';
    if (p.graded) return '途中';
    if (p.answers && Object.keys(p.answers).length) return '途中';
    return '';
  }

  function newsHTML() {
    if (!items.length) {
      return '<div class="card">' +
        '<p class="small muted" style="margin:0 0 12px">教材の目次を読めませんでした。' +
        'ローカルのファイルを直接開いた場合は読めません（GitHub Pages 上では読めます）。</p>' +
        '<a class="go" href="news.html" style="display:inline-flex">開く →</a></div>';
    }

    var top = items[0], p = progressOf(top.id);
    var label = p && p.done ? 'もう一度' : (statusLabel(p) === '途中' ? '続きから' : 'はじめる');

    var html = '<a class="card today" href="news.html?id=' + encodeURIComponent(top.id) + '">' +
      '<div class="meta-row"><span class="sec-label" style="margin:0">最新の教材</span>' +
        '<span>' + esc((top.date || '').replace(/-/g, '/')) + (top.time ? ' ' + esc(top.time) : '') + '</span>' +
        (top.genre ? '<span class="chip">' + esc(top.genre) + '</span>' : '') +
        (statusLabel(p) ? '<span class="chip chip-plain">' + statusLabel(p) + '</span>' : '') +
      '</div>' +
      '<h2>' + esc(top.title || top.id) + '</h2>' +
      '<span class="go">' + label + ' →</span>' +
    '</a>';

    if (items.length > 1) {
      html += '<div class="card"><div class="sec-label">これまでの教材</div><div class="list">' +
        items.slice(1, 21).map(function (it) {
          var q = progressOf(it.id), s = statusLabel(q);
          return '<a href="news.html?id=' + encodeURIComponent(it.id) + '">' +
            '<span class="d">' + esc((it.date || '').slice(5).replace('-', '/') + (it.time ? ' ' + it.time : '')) + '</span>' +
            '<span class="t">' + esc(it.title || it.id) + '</span>' +
            (s ? '<span class="s' + (s === '済' ? ' done' : '') + '">' + s + '</span>' : '') +
          '</a>';
        }).join('') + '</div></div>';
    }
    return html;
  }

  function drillHTML() {
    var parts = [
      ['Part 3', '会話問題', '3人の会話・意図問題・図表'],
      ['Part 4', '説明文', 'アナウンス・留守電・スピーチ'],
      ['Part 5', '短文穴埋め', '文法と語彙'],
      ['Part 6', '長文穴埋め', '文脈に合う語と一文挿入'],
      ['Part 7', '読解', '単一文書・複数文書']
    ];
    return '<div class="card soon">' +
      parts.map(function (p) {
        return '<div class="row">' +
          '<span><b>' + p[0] + '</b>　<span class="name">' + p[1] + '</span>' +
          '<div class="w" style="margin-top:2px">' + p[2] + '</div></span>' +
          '<span class="w">準備中</span></div>';
      }).join('') +
      '</div>' +
      '<p class="small muted" style="margin:12px 2px 0">' +
      '時事英語とは別のルーティンで教材を作り、<code>data/part3/</code> のようにパートごとに分けて置く予定です。' +
      '片方が止まっても、もう片方に影響しないようにするためです。</p>';
  }

  function render() {
    main.innerHTML = tab === 'news' ? newsHTML() : drillHTML();
    var done = items.filter(function (it) { var p = progressOf(it.id); return p && p.done; }).length;
    document.getElementById('stDone').textContent = done;
  }

  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
  });

  fetch('data/news/index.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (idx) {
      items = (idx && idx.items) || [];
      items.sort(function (a, b) { return (b.id || '').localeCompare(a.id || ''); });
      render();
    })
    .catch(function () { items = []; render(); });
})();
</script>
</body>
</html>
