<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="app-build" content="2026-09-18 b125c07">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOEIC Daily</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="style.css?v=4591a5f7">
<style>
body{padding-bottom:24px}
.hub-head{padding:22px 0 12px}
.head-top{display:flex;align-items:flex-start;gap:10px}
.head-top .grow{flex:1;min-width:0}
.hub-head h1{margin:0;font-size:22px;letter-spacing:.04em;font-weight:800}
.hub-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

.stats{display:flex;gap:10px;margin-top:16px}
.stats>*{
  flex:1;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 10px;text-align:center;
  text-decoration:none;color:inherit;display:block;
}
.stats .n{font-size:22px;font-weight:800;line-height:1.1}
.stats .l{font-size:11px;color:var(--muted);margin-top:3px}
a.stat .l{color:var(--accent)}

.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line)}
.tabs button{
  flex:1;padding:10px 4px;border:0;background:transparent;
  color:var(--muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-top:14px}

.today{display:block;text-decoration:none;color:inherit}
.today h2{margin:6px 0 0;font-size:17px;line-height:1.5}
.today .go{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  background:var(--accent);color:#fff;font-weight:700;font-size:14px;
  padding:10px 18px;border-radius:10px;
}
.meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.list a{
  display:flex;align-items:center;gap:10px;
  padding:12px 2px;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit;
}
.list a:last-child{border-bottom:0}
.list .d{flex:none;font-size:11px;font-weight:700;color:var(--muted);width:72px;line-height:1.35}
.list .t{flex:1;min-width:0;font-size:14px;line-height:1.5}
.list .s{flex:none;font-size:11px;font-weight:700;color:var(--accent)}
.list .s.done{color:var(--ok)}

.sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-row .cnt{margin-left:8px;font-weight:700;color:var(--muted);letter-spacing:0}

.soon .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;font-size:14px}
a.row{text-decoration:none;color:inherit}
a.row .w{color:var(--accent)}
.soon .row+.row{border-top:1px solid var(--line)}
.soon .row .w{color:var(--muted);font-size:12px}
.soon .row .name{color:var(--ink-2)}

/* 版の印。push が配信に載ったかを見るためだけのものなので、目立たせない */
.ver{margin-top:18px;text-align:center;font-size:10.5px;letter-spacing:.06em;color:var(--muted);opacity:.65}
</style>
</head>
<body>

<div class="wrap">
  <header class="hub-head">
    <div class="head-top">
      <div class="grow">
        <h1>TOEIC Daily</h1>
        <div class="sub">時事英語と実践対策</div>
      </div>
      <button class="icon-btn" id="btnCfg" title="設定">⚙</button>
    </div>
    <div class="stats">
      <div><div class="n" id="stStreak">0</div><div class="l">連続日数</div></div>
      <a class="stat" href="vocab.html"><div class="n" id="stVocab">0</div><div class="l">語彙帳 →</div></a>
      <div><div class="n" id="stDone">0</div><div class="l">学習した教材</div></div>
    </div>
    <div class="tabs">
      <button data-tab="news" class="on">時事</button>
      <button data-tab="drill">実践</button>
    </div>
  </header>

  <main id="main">
    <div class="card"><p class="muted small" style="margin:0">読み込み中…</p></div>
  </main>

  <div class="ver" id="ver"></div>
</div>

<script src="core.js?v=deb8b121"></script>
<script>
(function () {
  'use strict';
  var T = window.TOEIC, esc = T.esc;
  var main = document.getElementById('main');
  var items = [];
  /* 実践の教材から戻ったときは実践タブで開く。
     URL の指定を優先し、無ければ最後に見ていたタブを使う。
     古いページのリンク（?tab= が付いていない）から戻っても
     実践に戻れるよう、教材ページ側でも覚えさせている。 */
  var tab = (new URLSearchParams(location.search).get('tab') === 'drill')
    ? 'drill'
    : (T.Settings.get('hubTab') === 'drill' ? 'drill' : 'news');

  document.getElementById('btnCfg').addEventListener('click', function () { T.openSettings(); });

  document.getElementById('ver').textContent = 'ver ' + T.build();

  document.getElementById('stStreak').textContent = T.Log.streak();
  document.getElementById('stVocab').textContent = T.Vocab.count();

  var newsAll = false;   /* 時事英語の一覧を全部出すか */

  /* パート番号 → そのパートの教材。増えたらここに読み込む */
  var drills = { '3': [], '4': [], '5': [] };

  function progressOf(id) { return T.Log.progress('news:' + id); }

  function statusLabel(p) {
    if (!p) return '';
    if (p.done) return '済';
    if (p.graded) return '途中';
    if (p.answers && Object.keys(p.answers).length) return '途中';
    return '';
  }

  function newsHTML() {
    if (!items.length) {
      return '<div class="card">' +
        '<p class="small muted" style="margin:0 0 12px">教材の目次を読めませんでした。' +
        'ローカルのファイルを直接開いた場合は読めません（GitHub Pages 上では読めます）。</p>' +
        '<a class="go" href="news.html" style="display:inline-flex">開く →</a></div>';
    }

    var top = items[0], p = progressOf(top.id);
    var label = p && p.done ? 'もう一度' : (statusLabel(p) === '途中' ? '続きから' : 'はじめる');

    var html = '<a class="card today" href="news.html?id=' + encodeURIComponent(top.id) + '">' +
      '<div class="meta-row"><span class="sec-label" style="margin:0">最新の教材</span>' +
        '<span>' + esc((top.date || '').replace(/-/g, '/')) + (top.time ? ' ' + esc(top.time) : '') + '</span>' +
        (top.genre ? '<span class="chip">' + esc(top.genre) + '</span>' : '') +
        (statusLabel(p) ? '<span class="chip chip-plain">' + statusLabel(p) + '</span>' : '') +
      '</div>' +
      '<h2>' + esc(top.title || top.id) + '</h2>' +
      '<span class="go">' + label + ' →</span>' +
    '</a>';

    if (items.length > 1) {
      /* 直近1年ぶんを残すようにしたので、全部出すと長い。
         既定は20件までにして、必要なときだけ広げる。 */
      var rest = items.slice(1);
      var shown = newsAll ? rest : rest.slice(0, 20);

      html += '<div class="card">' +
        '<div class="sec-row"><span class="sec-label" style="margin:0">これまでの教材　' +
          '<span class="cnt">' + shown.length + ' / ' + rest.length + '</span></span>' +
          (rest.length > 20
            ? '<button class="btn btn-sm" id="newsAll">' + (newsAll ? '最近だけ' : 'すべて表示') + '</button>'
            : '') +
        '</div><div class="list">' +
        shown.map(function (it) {
          var q = progressOf(it.id), s = statusLabel(q);
          return '<a href="news.html?id=' + encodeURIComponent(it.id) + '">' +
            '<span class="d">' + esc((it.date || '').slice(5).replace('-', '/') + (it.time ? ' ' + it.time : '')) + '</span>' +
            '<span class="t">' + esc(it.title || it.id) + '</span>' +
            (s ? '<span class="s' + (s === '済' ? ' done' : '') + '">' + s + '</span>' : '') +
          '</a>';
        }).join('') + '</div></div>';
    }
    return html;
  }

  /* 実践対策。パートごとの一覧は drills.html に任せ、
     ホームには「最近追加された分」と各パートの入口だけを置く。
     パートが増えてもホームが散らからないようにするため。 */
  var PARTS = [
    { n: '3', name: '会話問題', note: '2〜3人の会話を1回だけ聞いて3問', ready: true },
    { n: '4', name: '説明文', note: 'アナウンス・留守電・スピーチ', ready: true },
    { n: '5', name: '短文穴埋め', note: '文法と語彙・1セット10問', ready: true },
    { n: '6', name: '長文穴埋め', note: '文脈に合う語と一文挿入', ready: false },
    { n: '7', name: '読解', note: '単一文書・複数文書', ready: false }
  ];

  function drillStatus(part, id) {
    var q = T.Log.progress('part' + part + ':' + id);
    if (!q) return '';
    /* 解き直しを始めると maxStep は 0 に戻るので、done も見る */
    if (q.done || q.maxStep >= 4) return '済';
    if (q.scored || (q.answers && Object.keys(q.answers).length) || q.maxStep > 0) return '途中';
    return '';
  }

  function drillLabel(part, it) {
    /* 解き終わったものは場面名を出す（一覧ページと揃える） */
    var q = T.Log.progress('part' + part + ':' + it.id);
    if (q && q.scene && drillStatus(part, it.id) === '済') return q.scene;
    if (part === '3') return (it.speakers || 2) + '人の会話';
    return (it.kind || '') + (it.questions ? ' ' + it.questions + '問' : '');
  }

  /* 各パートの教材を1本の列にまとめ、新しい順に返す */
  function recentDrills() {
    var all = [];
    Object.keys(drills).forEach(function (part) {
      drills[part].forEach(function (it) {
        all.push({ part: part, it: it });
      });
    });
    /* 日時は新しい順。同じ日時のセットは # の小さい順に並べる。
       同じ回に作った分は、番号のとおり上から解いていけるようにするため。 */
    all.sort(function (a, b) {
      var t = function (x) { return (x.it.date || '') + ' ' + (x.it.time || ''); };
      var d = t(b).localeCompare(t(a));
      if (d) return d;
      var n = function (x) { return typeof x.it.no === 'number' ? x.it.no : 0; };
      if (n(a) !== n(b)) return n(a) - n(b);
      return String(a.it.id || '').localeCompare(String(b.it.id || ''));
    });
    return all;
  }

  function drillHTML() {
    var recent = recentDrills();
    var html = '';

    /* まだ解いていないものを上に3件。大きなカードは置かない。
       「次に何をやるか」だけ分かればよく、最新1件を大きく出す必要がない。 */
    var todo = recent.filter(function (r) { return drillStatus(r.part, r.it.id) !== '済'; });
    var show = todo.length ? todo.slice(0, 3) : recent.slice(0, 3);

    if (show.length) {
      html += '<div class="card"><div class="sec-label">' +
        (todo.length ? '未着手の教材' : 'すべて解き終えました。もう一度やるなら') +
        '</div><div class="list">' +
        show.map(function (r) {
          var st = drillStatus(r.part, r.it.id);
          return '<a href="part' + r.part + '.html?id=' + encodeURIComponent(r.it.id) + '">' +
            '<span class="d">' + esc((r.it.date || '').slice(5).replace('-', '/') +
              (r.it.time ? ' ' + r.it.time : '')) + '</span>' +
            '<span class="t"><b>Part ' + r.part + ' #' + r.it.no + '</b>　' +
              esc(drillLabel(r.part, r.it)) + '</span>' +
            (st ? '<span class="s' + (st === '済' ? ' done' : '') + '">' + st + '</span>' : '') +
          '</a>';
        }).join('') + '</div></div>';
    }

    /* パートの入口。教材のあるパートは一覧ページへ */
    html += '<div class="card soon">' +
      PARTS.map(function (p) {
        var list = drills[p.n] || [];
        if (p.ready) {
          var done = list.filter(function (it) { return drillStatus(p.n, it.id) === '済'; }).length;
          return '<a class="row" href="drills.html?part=' + p.n + '">' +
            '<span><b>Part ' + p.n + '</b>　<span class="name">' + p.name + '</span>' +
            '<div class="w" style="margin-top:2px">' + p.note + '</div></span>' +
            '<span class="w">' + list.length + ' セット' +
              (done ? '・済 ' + done : '') + ' →</span></a>';
        }
        return '<div class="row">' +
          '<span><b>Part ' + p.n + '</b>　<span class="name">' + p.name + '</span>' +
          '<div class="w" style="margin-top:2px">' + p.note + '</div></span>' +
          '<span class="w">準備中</span></div>';
      }).join('') +
      '</div>';

    return html;
  }

  function render() {
    main.innerHTML = tab === 'news' ? newsHTML() : drillHTML();
    /* 「学習した教材」は時事と実践の合計。片方だけ数えると実態と合わない */
    var done = items.filter(function (it) { var p = progressOf(it.id); return p && p.done; }).length +
      recentDrills().filter(function (r) { return drillStatus(r.part, r.it.id) === '済'; }).length;
    document.getElementById('stDone').textContent = done;
  }

  main.addEventListener('click', function (e) {
    if (!e.target.closest('#newsAll')) return;
    newsAll = !newsAll;
    render();
  });

  /* URL で指定されたタブに見た目を合わせる */
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.tab === tab);
  });

  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.dataset.tab;
    T.Settings.set('hubTab', tab);
    document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
  });

  /* 時事と Part 3 の目次を別々に読む。片方が読めなくても、もう片方は出す。 */
  function loadIndex(url) {
    return fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (idx) {
        var list = (idx && idx.items) || [];
        /* 日付＋時刻で新しい順。id で並べると p3-sample-… のような
           日付以外の id が先頭に来てしまう。 */
        var key = function (x) { return (x.date || '') + ' ' + (x.time || '') + ' ' + (x.id || ''); };
        list.sort(function (a, b) { return key(b).localeCompare(key(a)); });
        return list;
      })
      .catch(function () { return []; });
  }

  Promise.all([
    loadIndex('data/news/index.json'),
    loadIndex('data/part3/index.json'),
    loadIndex('data/part4/index.json'),
    loadIndex('data/part5/index.json')
  ]).then(function (r) {
    items = r[0];
    drills['3'] = T.numberSets(r[1]);
    drills['4'] = T.numberSets(r[2]);
    drills['5'] = T.numberSets(r[3]);
    render();
  });

  /* 教材を終えて戻ってきたときだけ、数秒「Done」を出す。
     .toast は pointer-events:none なので操作の邪魔にならない。 */
  (function () {
    var m = T.takeFlash ? T.takeFlash() : '';
    if (m) T.toast(m, 2600);
  })();
})();
</script>
</body>
</html>
