<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="app-build" content="2026-09-14 8189bfc">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>実践対策 | TOEIC Daily</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="style.css?v=0b9f5d1c">
<style>
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}

.app-head{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:8px;padding:12px 0}
.head-row .grow{flex:1;min-width:0}
.head-row h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.02em}
.head-row .sub{font-size:11px;color:var(--muted);margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.sec-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}

/* セットの一覧。1行に「番号・中身・日付・状態」 */
.sets a{
  display:flex;align-items:center;gap:10px;
  padding:12px 2px;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit;
}
.sets a:last-child{border-bottom:0}
.sets .no{
  flex:none;width:44px;font-size:12px;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.sets .t{flex:1;min-width:0;font-size:14px;line-height:1.5}
.sets .t .d{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.sets .s{flex:none;font-size:11px;font-weight:700;color:var(--accent)}
.sets .s.done{color:var(--ok)}

.empty{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
.soon{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
</style>
</head>
<body>

<header class="app-head">
  <div class="wrap">
    <div class="head-row">
      <div class="grow">
        <h1 id="ttl">実践対策</h1>
        <div class="sub" id="sub"></div>
      </div>
      <a class="icon-btn" href="index.html?tab=drill" title="ホーム">⌂</a>
      <a class="icon-btn" href="vocab.html" title="語彙帳">▤</a>
      <button class="icon-btn" id="btnCfg" title="設定">⚙</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<script src="core.js?v=ba5c2a3e"></script>
<script>
(function () {
  'use strict';
  var T = window.TOEIC;
  var esc = T.esc;

  /* ホームに戻ったときにこのタブで開くよう覚えておく */
  T.Settings.set('hubTab', 'drill');

  /* パートごとの定義。Part 4 以降を足すときはここに1行足して
     data/part4/ に教材を置けばよい。ページは使い回せる。 */
  var PARTS = {
    '3': { name: '会話問題', dir: 'data/part3/', page: 'part3.html', key: 'part3:', ready: true,
           note: '2〜3人の会話を1回だけ聞いて3問。設問は先読みできる。' },
    '4': { name: '説明文', dir: 'data/part4/', page: 'part4.html', key: 'part4:', ready: false,
           note: 'アナウンス・留守電・スピーチ' },
    '5': { name: '短文穴埋め', dir: 'data/part5/', page: 'part5.html', key: 'part5:', ready: false,
           note: '文法と語彙' },
    '6': { name: '長文穴埋め', dir: 'data/part6/', page: 'part6.html', key: 'part6:', ready: false,
           note: '文脈に合う語と一文挿入' },
    '7': { name: '読解', dir: 'data/part7/', page: 'part7.html', key: 'part7:', ready: false,
           note: '単一文書・複数文書' }
  };

  var n = (new URLSearchParams(location.search).get('part') || '3');
  var P = PARTS[n] || PARTS['3'];
  if (!PARTS[n]) n = '3';

  document.getElementById('btnCfg').addEventListener('click', function () { T.openSettings(); });
  document.getElementById('ttl').textContent = 'Part ' + n + '　' + P.name;
  document.getElementById('sub').textContent = P.note;
  document.title = 'Part ' + n + ' | TOEIC Daily';

  var main = document.getElementById('main');

  function statusOf(id) {
    var q = T.Log.progress(P.key + id);
    if (!q) return '';
    /* 解き直しを始めると maxStep は 0 に戻るので、done も見る */
    if (q.done || q.maxStep >= 4) return '済';
    if (q.scored || (q.answers && Object.keys(q.answers).length) || q.maxStep > 0) return '途中';
    return '';
  }

  function label(it) {
    /* 解き終わったセットは場面名を出す。何の話だったか思い出せたほうが選びやすい。
       index.json には場面を入れていない（先読みの練習が崩れるため）ので、
       解いたときに残した記録から取る。まだ解いていないセットは伏せたままにする。 */
    var q = T.Log.progress(P.key + it.id);
    if (q && q.scene && statusOf(it.id) === '済') return q.scene;
    if (n === '3') return (it.speakers || 2) + '人の会話';
    return (it.kind || '') + (it.questions ? ' ' + it.questions + '問' : '');
  }

  function render(items) {
    if (!P.ready) {
      main.innerHTML = '<div class="card"><p class="soon">Part ' + n + ' はまだ準備中です。' +
        '教材ができたらここに並びます。</p></div>';
      return;
    }
    if (!items.length) {
      main.innerHTML = '<div class="card"><p class="empty">まだ教材がありません。' +
        'ルーティンが <code>' + esc(P.dir) + '</code> に書き出すと、ここに並びます。<br>' +
        'ローカルのファイルを直接開いた場合は読めません（GitHub Pages 上では読めます）。</p></div>';
      return;
    }

    var done = items.filter(function (it) { return statusOf(it.id) === '済'; }).length;

    main.innerHTML = '<div class="card">' +
      '<div class="sec-label">全 ' + items.length + ' セット　／　済 ' + done + '</div>' +
      '<div class="sets">' +
      items.map(function (it) {
        var s = statusOf(it.id);
        return '<a href="' + P.page + '?id=' + encodeURIComponent(it.id) + '">' +
          '<span class="no">#' + it.no + '</span>' +
          '<span class="t">' + esc(label(it)) +
            '<span class="d">' + esc((it.date || '').replace(/-/g, '/')) +
            (it.time ? ' ' + esc(it.time) : '') + '</span></span>' +
          (s ? '<span class="s' + (s === '済' ? ' done' : '') + '">' + s + '</span>' : '') +
        '</a>';
      }).join('') +
      '</div></div>';
  }

  if (!P.ready) { render([]); return; }

  fetch(P.dir + 'index.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (idx) {
      var items = T.numberSets((idx && idx.items) || []);
      render(items);
    })
    .catch(function () { render([]); });
})();
</script>
</body>
</html>
